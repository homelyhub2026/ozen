   <div class="list">${settings().partners.map((p, i) => `<button class="item" data-act="demoPick" data-v="${p.id}"><span class="av c${(i % 5) + 1}">${esc((p.name || '?')[0].toUpperCase())}</span><div class="grow t">${esc(p.name)}</div></button>`).join('')}</div></div>
   ${LANGSEG()}</div></div>`;
}
function applyTheme() { if (P.theme) document.documentElement.setAttribute('data-theme', P.theme); else document.documentElement.removeAttribute('data-theme'); document.documentElement.lang = P.lang; }

/* ---------------- demo sample data (practice mode only) ---------------- */
async function seedDemo() {
  const save = P.demoMe; P.demoMe = 'p1'; S.quiet = true; const q = { quiet: true };
  await post('opening', { setupId: 'demo', cutoff: Date.now() - 60000, cashTargets: { bank: 50000, p1: 0, p2: 2000, p3: 0, p4: 0, p5: 0 }, stockTargets: { 'wh.naikap.filled': 40, 'wh.naikap.empty': 15, 'wh.wh2.filled': 12, 'wh.wh2.empty': 0, 'wh.wh3.filled': 0, 'wh.wh3.empty': 0, factory: 20 }, after: {} }, q);
  const sample = [['Sharma Niwas', '9841000001', 'Naikap', 27.6935, 85.2683, 3, 'p1', 3, 1000, 0], ['Kalanki Boys Hostel', '9841000002', 'Kalanki', 27.6930, 85.2810, 9, 'p2', 9, 3000, 540],
    ['Thapa Office', '9841000003', 'Balkhu', 27.6849, 85.2967, 6, 'p3', 6, 2000, 0], ['Shrestha House', '9841000004', 'Satungal', 27.6870, 85.2500, 3, 'p4', 3, 1000, 0],
    ['Om Girls Hostel', '9841000005', 'Kuleshwor', 27.6920, 85.2950, 6, 'p5', 6, 2000, 120]];
  for (const [name, phone, area, lat, lng, pkg, partner, held, deposit, due] of sample)
    await post('openCust', { id: 'c_' + hashId(normKey(name, phone)), name, phone, area, lat, lng, pkg, rate: 60, partner, held, deposit, due, hist: 0, cutoff: Date.now() - 60000, setupId: 'demo', after: {} }, q);
  const c1 = S.customers.find(c => c.name === 'Sharma Niwas');
  await post('deliver', { cust: c1.id, qty: 3, returned: 3, wh: 'naikap', refillCash: 180, refillCashBy: 'p1', date: isoDay(Date.now()) }, q);
  const sh = S.customers.find(c => c.name === 'Shrestha House');
  await post('order', { cust: sh.id, qty: 3, wh: 'naikap', assigned: 'p4' }, q);
  P.demoMe = 'p2'; await post('expense', { amount: 500, cat: 'Fuel', from: 'p2' }, q);
  // sample online orders (practice mode only) so the inbox can be seen
  await S.store.txn(async () => { const o = Ops();
    o.set('requests', 'demo-r1', { kind: 'order', status: 'new', cust: c1.id, name: c1.name, qty: 3, when: 'morning', note: '3rd floor', at: Date.now() - 600000 });
    o.set('requests', 'demo-r2', { kind: 'signup', status: 'new', name: 'Ramesh Thapa', phone: '9841234567', area: 'Kalanki', address: 'Near Kalanki chowk', pkg: 6, note: '', lat: 27.6930, lng: 85.2810, at: Date.now() - 300000 });
    return o; });
  P.demoMe = save; S.quiet = false;
}

/* ---------------- boot ---------------- */
function onData(snap) {
  const newReq = (snap.requests || []).filter(r => !(S.requests || []).some(x => x.id === r.id));
  if (S.loaded && newReq.length) { toast(tf('{n} new online order(s)', { n: newReq.length })); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} }
  S.requests = (snap.requests || []).sort((a, b) => a.at - b.at);
  S.fund = (snap.fund || []).sort((a, b) => a.at - b.at);
  S.meta = snap.meta || {}; S.customers = (snap.customers || []).filter(c => !c.deleted); S.orders = snap.orders; S.txs = snap.txs; S.moves = snap.moves; S.logs = snap.logs;
  S.loaded = true;
  if (!DEMO && S.meta.settings && (S.meta.settings.schema || 1) < 2) migrate();
  const ae = document.activeElement; if (!(ae && ae.form && ['setForm', 'setupForm'].includes(ae.form.id))) scheduleRender();
}
let rT; function scheduleRender() { clearTimeout(rT); rT = setTimeout(render, 30); }
function loadScript(src) { return new Promise((res, rj) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rj; document.head.appendChild(s); }); }
async function startPractice() {
  if (S.store) return;
  S.store = DemoStore(); S.user = { email: 'practice' };
  S.store.init(onData);
  if (S.store.fresh) await seedDemo();
}
async function boot() {
  applyTheme();
  if (DEMO) { if (P.practice) await startPractice(); render(); return; }
  render();
  const v = '10.12.2';
  try {
    await loadScript(`https://cdn.jsdelivr.net/npm/firebase@${v}/firebase-app-compat.js`);
    await Promise.all([loadScript(`https://cdn.jsdelivr.net/npm/firebase@${v}/firebase-auth-compat.js`), loadScript(`https://cdn.jsdelivr.net/npm/firebase@${v}/firebase-firestore-compat.js`)]);
  } catch (e) { $('#app').innerHTML = '<div class="login"><p>Could not load. Check internet and reload.</p></div>'; return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  const fs0 = firebase.firestore();
  try { fs0.settings({ ignoreUndefinedProperties: true, merge: true }); } catch (e) {}
  try { fs0.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}
  fs0.doc('public/slots').onSnapshot(d => { S.slots = d.exists ? d.data() : {}; if (!S.user) refreshSlots(); else scheduleRender(); }, () => {});
  firebase.auth().onAuthStateChanged(u => {
    S.user = u;
    if (u && !S.store) { S.store = FireStore(); S.store.init(onData); setTimeout(flushQueue, 3000); }
    if (!u) { S.loaded = false; if (S.store) location.reload(); }
    render();
  });
}
if ('serviceWorker' in navigator && location.protocol === 'https:' && !DEMO) navigator.serviceWorker.register('sw.js').catch(() => {});
// ---- automatic update: when a new index.html is uploaded to GitHub, every open app switches to it by itself ----
const BUILD = '2026-11-06b';
async function checkUpdate() {
  if (DEMO || !/^https?:$/.test(location.protocol) || !navigator.onLine) return;
  try {
    const txt = await (await fetch('./index.html?u=' + Date.now(), { cache: 'no-store' })).text();
    const m = txt.match(/const BUILD = '([^']+)'/); if (!m || m[1] === BUILD) return;
    const busy = document.querySelector('.sheet') || Q.list.some(x => x.status === 'pending') || S.sync === 'saving';
    if (busy) { toast(t('A new version of the app is ready. It will load when you finish.')); setTimeout(checkUpdate, 60000); return; }
    // put the new version into the phone's copy first, so the reload opens it (the app opens from that copy)
    try { if (window.caches) { const c = await caches.open('ozen-v5'); const base = location.pathname.replace(/[^/]*$/, '');
      for (const k of [base, base + 'index.html']) await c.put(new Request(location.origin + k), new Response(txt, { headers: { 'Content-Type': 'text/html; charset=utf-8' } })); } } catch (e) {}
    toast(t('Updating the app…')); setTimeout(() => location.reload(), 1200);
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
setInterval(checkUpdate, 15 * 60000); setTimeout(checkUpdate, 20000);
boot();
</script>
