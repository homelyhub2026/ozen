<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e2457">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>OZEN</title>
<meta name="apple-mobile-web-app-title" content="OZEN">
<meta name="application-name" content="OZEN">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0e2457; --brand:#0b3fa8; --sky:#14a6e6; --sky2:#5cc7f2; --green:#45b649;
  --ink:#10234f; --ink2:#41557e; --muted:#6c7c99;
  --water:#14a6e6; --water-soft:#e3f3fc; --paper:#f1f6fc; --card:#ffffff; --line:#dde6f2;
  --ok:#2f9a43; --warn:#b5760a; --bad:#c53a3a; --warn-soft:#fdf2dc; --bad-soft:#fbe5e5; --ok-soft:#e2f5e3;
  --nav:#ffffff; --shadow:0 1px 2px rgba(14,36,87,.06),0 4px 14px rgba(14,36,87,.05);
  --band:linear-gradient(135deg,#0e2457 0%,#0b3fa8 55%,#1489dd 100%);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#e6eefb; --ink2:#a8bbdc; --muted:#8091b2; --water-soft:#14284f; --paper:#09142b; --card:#0f1e3d; --line:#1f3360; --nav:#0c1933;
  --warn-soft:#3a2d10; --bad-soft:#3f1a1f; --ok-soft:#123220; --shadow:none; --brand:#3b74e6;
}}
:root[data-theme="dark"]{
  --ink:#e6eefb; --ink2:#a8bbdc; --muted:#8091b2; --water-soft:#14284f; --paper:#09142b; --card:#0f1e3d; --line:#1f3360; --nav:#0c1933;
  --warn-soft:#3a2d10; --bad-soft:#3f1a1f; --ok-soft:#123220; --shadow:none; --brand:#3b74e6;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Mukta","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3,.v,.n,.brandname{font-family:"Poppins","Mukta",system-ui,sans-serif}

/* brand header */
.top{position:sticky;top:0;z-index:5;background:var(--band);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;margin-top:calc(-1 * env(safe-area-inset-top,0px));box-shadow:0 2px 10px rgba(14,36,87,.18)}
.top .mark{width:40px;height:40px;border-radius:50%;background:#fff;flex:none;object-fit:contain;padding:3px;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.top .ttl{flex:1;min-width:0;line-height:1.15}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who{font-size:12.5px;text-align:right;line-height:1.25;flex:none;max-width:38%}
.top .who b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);border-radius:20px;padding:1px 8px;font-size:11.5px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7be08a}
.dot.off{background:#ffc94d}
main{max-width:760px;margin:0 auto;padding:4px 16px 110px}
.demo-banner{background:var(--warn-soft);color:var(--ink);font-size:14px;padding:8px 12px;border-radius:10px;margin:12px 0}

/* home hero: blue band continuing from header, shelf card floats on it */
.hero{margin:0 -16px;padding:24px 20px 74px;color:#fff;position:relative;overflow:hidden;min-height:220px;background:#0e2457}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(90deg,rgba(14,36,87,.95) 0%,rgba(11,52,150,.78) 42%,rgba(11,63,168,.12) 78%,rgba(11,63,168,0) 100%),var(--poster);background-size:cover;background-position:70% 38%}
.hero::after{content:"";position:absolute;left:-5%;right:-5%;bottom:-1px;height:46px;background:var(--paper);border-radius:55% 45% 0 0/100% 100% 0 0}
.hero>*{position:relative;z-index:1;max-width:62%}
.hero .greet{font-size:14px;opacity:.9}
.hero .big{font-family:"Poppins","Mukta",sans-serif;font-size:23px;font-weight:700;line-height:1.2;margin:2px 0 6px;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.hero .tagl{font-size:15px;opacity:.95;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:3px 10px;border-radius:20px;backdrop-filter:blur(4px)}
@media (min-width:960px){.hero{margin:0;border-radius:0 0 28px 28px;min-height:270px;padding:36px 36px 84px}.hero .big{font-size:30px}.hero>*{max-width:55%}}
.shelf{background:var(--card);border-radius:20px;padding:16px 10px 10px;box-shadow:var(--shadow);border:1px solid var(--line);margin-top:-44px;position:relative;z-index:2}
.shelf-jars{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;align-items:end}
.jarbox{text-align:center}
.jarbox svg{width:100%;max-width:76px;height:auto;display:block;margin:0 auto}
.jarbox .n{font-size:24px;font-weight:700;line-height:1;margin-top:6px;color:var(--ink)}
.jarbox .l{font-size:13px;color:var(--muted);line-height:1.2;margin-top:3px}
.jar .shell{fill:none;stroke:var(--brand);stroke-width:2.2}
.jar .cap{fill:var(--brand)}
.jar .glass{fill:var(--water-soft)}
.jar .band{fill:#fff;opacity:.28}
.jar .label{fill:#fff;stroke:var(--brand);stroke-width:.8}
.jar .drop{fill:#14a6e6}
.jar .lt{font:800 8.2px Poppins,Mukta,sans-serif;fill:#0b3fa8;letter-spacing:.2px}
.jar .water{fill:url(#wgrad)}
.jar.dry .water{fill:#b9c6d9}
.jar.away .water{fill:var(--sky2)}
.jar.out .water{fill:var(--green);opacity:.85}
.shelf-foot{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);margin-top:12px;padding:8px 6px 0;font-size:14px}

.alert{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.alert.warn{background:var(--warn-soft)} .alert.bad{background:var(--bad-soft)} .alert.ok{background:var(--ok-soft)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow);font:inherit;color:inherit}
.stat .v{font-size:20px;font-weight:700;line-height:1.2}
.stat .k{font-size:13px;color:var(--muted)}
.stat.wide{grid-column:1/-1}
.stat.accent{border-left:4px solid var(--sky)}
.stat.accent2{border-left:4px solid var(--green)}

.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;gap:11px;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;line-height:1.25}
.item .s{font-size:13px;color:var(--muted);line-height:1.3}
.item.void{opacity:.5} .item.void .t{text-decoration:line-through}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;background:var(--brand)}
.av.c1{background:#0b3fa8}.av.c2{background:#1489dd}.av.c3{background:#2f9a43}.av.c4{background:#0e2457}.av.c5{background:#0f8fa3}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:1px 9px;border-radius:20px;background:var(--water-soft);color:var(--ink);white-space:nowrap}
.chip.warn{background:var(--warn-soft)} .chip.bad{background:var(--bad-soft)} .chip.ok{background:var(--ok-soft)}
.amt{font-weight:700;white-space:nowrap}
.amt.plus{color:var(--ok)} .amt.minus{color:var(--bad)}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}

.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--brand);color:#fff;cursor:pointer;min-height:44px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;border-radius:28px;padding:13px 20px;background:linear-gradient(135deg,#0b3fa8,#1489dd);box-shadow:0 6px 18px rgba(11,63,168,.35)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--nav);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--brand);font-weight:700}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--green)}
@media (min-width:960px){
  nav.tabs{top:0;right:auto;width:96px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:calc(80px + env(safe-area-inset-top,0px))}
  nav.tabs button{flex:0;padding:14px 4px}
  nav.tabs button.on::before{top:20%;bottom:20%;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  .top{padding-left:112px}
  main{margin-left:max(96px,calc(50vw - 380px + 48px))}
  .fab{bottom:28px}
}

h2{font-size:21px;margin:18px 0 10px;font-weight:700;letter-spacing:-.01em}
h3{font-size:16px;margin:22px 0 8px;font-weight:600;color:var(--ink2)}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0} .right{text-align:right}

.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 6px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--brand);color:#fff}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}

.profile-head{background:var(--band);color:#fff;border-radius:18px;padding:16px;margin-top:8px;box-shadow:0 6px 18px rgba(11,63,168,.2)}
.profile-head h2{margin:0;color:#fff}
.profile-head .s{opacity:.85;font-size:14px}
.profile-head .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.profile-head .acts a{background:rgba(255,255,255,.16);color:#fff;text-decoration:none;text-align:center;border-radius:10px;padding:9px 4px;font-weight:600;font-size:14px}

table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-weight:600;color:var(--muted);font-size:13px}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}

.veil{position:fixed;inset:0;background:rgba(9,20,43,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:4px solid var(--sky)}
@media (min-width:600px){.veil{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin-top:0}
.f{display:block;margin:0 0 12px}
.f>span{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);min-height:44px}
.f textarea{min-height:70px}
.f small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-weight:600;max-width:90vw}

.loginwrap{min-height:100vh;position:relative;overflow:hidden;background:#0e2457}
.loginwrap::before{content:"";position:fixed;inset:0;background-image:linear-gradient(180deg,rgba(14,36,87,.55) 0%,rgba(14,36,87,.25) 40%,rgba(9,20,43,.88) 100%),var(--poster);background-size:cover;background-position:66% center}
.login{max-width:420px;margin:0 auto;padding:30px 20px 40px;position:relative}
.login .logo{width:132px;height:132px;border-radius:50%;background:#fff;display:block;margin:0 auto 10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.login .ozen{display:block;width:220px;max-width:70%;margin:0 auto 4px;border-radius:10px;background:#fff;padding:6px 10px}
.login .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 40px rgba(0,0,0,.35);margin-top:22px}
.whogrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who-opt{position:relative;cursor:pointer}
.who-opt input{position:absolute;opacity:0;pointer-events:none}
.who-opt span{display:block;text-align:center;padding:10px 6px;border:1px solid var(--line);border-radius:10px;font-weight:600;background:var(--paper)}
.who-opt input:checked+span{background:var(--brand);color:#fff;border-color:var(--brand)}
.who-opt input:focus-visible+span{outline:3px solid var(--sky);outline-offset:2px}
.login .tag{text-align:center;color:#fff;font-size:16px;margin:6px 0 0;text-shadow:0 1px 6px rgba(0,0,0,.45)}

#print{display:none}
@media print{
  @page{margin:12mm}
  body{background:#fff;color:#000}
  #app,nav,.fab,.veil,.toast{display:none!important}
  #print{display:block;font-family:"Mukta","Poppins",sans-serif;color:#111}
  #print .lh{display:flex;align-items:center;gap:12px;border-bottom:3px solid #0b3fa8;padding-bottom:8px;margin-bottom:10px}
  #print .lh img.l{width:58px;height:58px}
  #print .lh img.o{height:46px;margin-left:auto}
  #print .lh .c{font-size:18px;font-weight:700;color:#0e2457;font-family:"Poppins","Mukta",sans-serif}
  #print .lh .a{font-size:11px;color:#333}
  #print h1{font-size:17px;margin:6px 0 2px;color:#0b3fa8}
  #print h3{font-size:14px;margin:12px 0 2px;color:#0e2457}
  #print table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
  #print th{background:#e8f1fc;color:#0e2457}
  #print th,#print td{border:1px solid #b9c7da;padding:4px 6px;text-align:right}
  #print th:first-child,#print td:first-child{text-align:left}
  #print .meta{font-size:12px;color:#333;margin:2px 0 8px}
  #print .foot{margin-top:14px;font-size:10.5px;color:#666;border-top:1px solid #ccc;padding-top:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* ============================================================
   Jar Hisab — shared record app for a water jar business
   Database details live in config.js (see SETUP guide).
   Without config.js the app offers a practice mode with sample data.
   ============================================================ */
const FIREBASE_CONFIG = window.OZEN_CONFIG || {};
const CONFIGURED = !!FIREBASE_CONFIG.apiKey;
// One shared company inbox, separate password per partner: company+p1@gmail.com ... company+p5@gmail.com
const COMPANY_EMAIL = (FIREBASE_CONFIG.companyEmail || '').trim().toLowerCase();
const aliasEmail = n => { const [u, d] = COMPANY_EMAIL.split('@'); return `${u}+p${n}@${d}`; };

const BS_START = 2075, BS_AD0 = Date.UTC(2018, 3, 14); // 2075-01-01 BS = 2018-04-14 AD
const BS = [
 [31,31,32,31,31,31,30,29,30,29,30,30],[31,32,31,32,31,30,30,30,29,29,30,30],
 [31,32,31,32,31,30,30,30,29,30,29,31],[31,31,31,32,31,31,30,29,30,29,30,30],
 [31,31,32,31,31,31,30,29,30,29,30,30],[31,32,31,32,31,30,30,30,29,29,30,30],
 [31,32,31,32,31,30,30,30,29,30,29,31],[30,32,31,32,31,30,30,30,29,30,30,30],
 [31,31,32,31,31,30,30,30,29,30,30,30],[31,31,32,31,31,30,30,30,29,30,30,30],
 [31,32,31,32,30,31,30,30,29,30,30,30],[30,32,31,32,31,30,30,30,29,30,30,30],
 [31,31,32,31,31,31,30,30,29,30,30,30],[30,31,32,32,30,31,30,30,29,30,30,30],
 [30,32,31,32,31,30,30,30,29,30,30,30]
];
const BS_M_NE = ['बैशाख','जेठ','असार','साउन','भदौ','असोज','कात्तिक','मंसिर','पुस','माघ','फागुन','चैत'];
const BS_M_EN = ['Baisakh','Jestha','Asar','Shrawan','Bhadra','Ashoj','Kartik','Mangsir','Poush','Magh','Falgun','Chaitra'];
function adToBs(ms) {
  const d = new Date(ms);
  let days = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - BS_AD0) / DAY);
  if (days < 0) return null;
  let y = 0;
  while (y < BS.length) { const yl = BS[y].reduce((a, b) => a + b, 0); if (days < yl) break; days -= yl; y++; }
  if (y >= BS.length) return null;
  let m = 0; while (days >= BS[y][m]) { days -= BS[y][m]; m++; }
  return [BS_START + y, m + 1, days + 1];
}
function fmtDate(ms) {
  if (!ms) return '';
  if (P.cal === 'bs') {
    const b = adToBs(ms);
    if (b) return `${b[2]} ${(P.lang === 'ne' ? BS_M_NE : BS_M_EN)[b[1] - 1]} ${b[0]}`;
  }
  return new Date(ms).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}
function fmtDT(ms) {
  const d = new Date(ms);
  return fmtDate(ms) + ', ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
const isoDay = ms => { const d = new Date(ms); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dayStart = ms => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
function monthStart(ms) {
  if (P.cal === 'bs') { const b = adToBs(ms); if (b) return dayStart(ms) - (b[2] - 1) * DAY; }
  const d = new Date(ms); return new Date(d.getFullYear(), d.getMonth(), 1).getTime();
}
const fromInputDay = v => { if (!v) return Date.now(); if (v === isoDay(Date.now())) return Date.now(); return new Date(v + 'T12:00:00').getTime(); };

const INC = n => ({ __inc: n });
const isInc = v => v && typeof v === 'object' && '__inc' in v;
function setPath(obj, path, v) {
  const ks = path.split('.'); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { if (!o[ks[i]] || typeof o[ks[i]] !== 'object') o[ks[i]] = {}; o = o[ks[i]]; }
  const last = ks[ks.length - 1];
  o[last] = isInc(v) ? num(o[last]) + v.__inc : v;
}
function DemoStore() {
  let db = store.get('jh_demo2', null);
  let cb;
  const fresh = !db;
  if (!db) db = { meta: { settings: { id: 'settings', ...DEF_SETTINGS }, stock: { id: 'stock', wh: {}, factory: 0, total: 0 }, cash: { id: 'cash', p: {}, bank: 0 } } };
  const save = () => store.set('jh_demo2', db);
  const snap = () => ({
    meta: Object.fromEntries(Object.entries(db.meta || {}).map(([k, v]) => [k, v])),
    customers: Object.values(db.customers || {}), orders: Object.values(db.orders || {}),
    txs: Object.values(db.txs || {}), moves: Object.values(db.moves || {}), logs: Object.values(db.logs || {})
  });
  return {
    fresh,
    init(onChange) { cb = onChange; cb(snap()); },
    async commit(ops) {
      for (const o of ops) {
        const c = db[o.col] = db[o.col] || {};
        if (o.op === 'set') c[o.id] = JSON.parse(JSON.stringify({ ...o.data, id: o.id }));
        else if (o.op === 'merge') { const d = c[o.id] = c[o.id] || { id: o.id }; for (const [k, v] of Object.entries(o.data)) d[k] = (v && typeof v === 'object' && d[k] && typeof d[k] === 'object') ? { ...d[k], ...v } : v; }
        else { const doc = c[o.id] = c[o.id] || { id: o.id }; for (const [k, v] of Object.entries(o.data)) setPath(doc, k, v); }
      }
      save(); cb(snap());
    },
    async range(col, from, to) { return Object.values(db[col] || {}).filter(x => x.at >= from && x.at <= to); },
    async byCust(col, id) { return Object.values(db[col] || {}).filter(x => x.cust === id); },
    reset() { try { localStorage.removeItem('jh_demo2'); } catch (e) {} location.reload(); }
  };
}
function FireStore() {
  const fs = firebase.firestore();
  const conv = d => { const o = {}; for (const [k, v] of Object.entries(d)) o[k] = isInc(v) ? firebase.firestore.FieldValue.increment(v.__inc) : v; return o; };
  const docs = s => s.docs.map(d => ({ ...d.data(), id: d.id }));
  return {
    async init(onChange) {
      const defs = { settings: DEF_SETTINGS, stock: { wh: {}, factory: 0, total: 0 }, cash: { p: {}, bank: 0 } };
      for (const [k, v] of Object.entries(defs)) {
        const ref = fs.doc('meta/' + k);
        try { const g = await ref.get(); if (!g.exists) await ref.set(v); } catch (e) { console.warn(e); }
      }
      const snap = { meta: {}, customers: [], orders: [], txs: [], moves: [], logs: [] };
      const since = Date.now() - 120 * DAY;
      let recentOrders = [], pendingOrders = [];
      const fire = () => onChange(snap);
      const err = e => { console.error(e); toast(e.message); };
      fs.collection('meta').onSnapshot(s => { snap.meta = {}; s.forEach(d => snap.meta[d.id] = d.data()); fire(); }, err);
      fs.collection('customers').onSnapshot(s => { snap.customers = docs(s); fire(); }, err);
      const mergeOrders = () => { const m = new Map(); [...recentOrders, ...pendingOrders].forEach(o => m.set(o.id, o)); snap.orders = [...m.values()]; fire(); };
      fs.collection('orders').where('at', '>=', since).onSnapshot(s => { recentOrders = docs(s); mergeOrders(); }, err);
      fs.collection('orders').where('status', '==', 'pending').onSnapshot(s => { pendingOrders = docs(s); mergeOrders(); }, err);
      for (const c of ['txs', 'moves', 'logs']) fs.collection(c).where('at', '>=', since).onSnapshot(s => { snap[c] = docs(s); fire(); }, err);
    },
    async commit(ops) {
      const b = fs.batch();
      for (const o of ops) {
        const ref = fs.collection(o.col).doc(o.id);
        if (o.op === 'set') b.set(ref, o.data); else if (o.op === 'merge') b.set(ref, o.data, { merge: true }); else b.update(ref, conv(o.data));
      }
      // Offline: Firestore saves on the device at once and syncs later; don't wait for the server.
      const done = b.commit();
      done.catch(e => { console.error(e); toast(e.message); });
      await Promise.race([done, new Promise(r => setTimeout(r, 1200))]);
    },
    async range(col, from, to) { return docs(await fs.collection(col).where('at', '>=', from).where('at', '<=', to).get()); },
    async byCust(col, id) { return docs(await fs.collection(col).where('cust', '==', id).get()); }
  };
}

/* ---------------- write builder: every money/stock effect is recorded (fx) so it can be undone ---------------- */
function Batch() {
  const ops = [], incs = [];
  return {
    set(col, id, data) { ops.push({ op: 'set', col, id, data }); },
    upd(col, id, data) { ops.push({ op: 'upd', col, id, data }); },
    merge(col, id, data) { ops.push({ op: 'merge', col, id, data }); },
    fx(list) { incs.push(...list); },
    log(k, v) { ops.push({ op: 'set', col: 'logs', id: uid(), data: { at: Date.now(), by: me().id, k, v } }); },
    build() {
      const g = {};
      for (const [c, i, p, n] of incs) {
        const key = c + '/' + i; g[key] = g[key] || { col: c, id: i, data: {} };
        g[key].data[p] = INC(((g[key].data[p] || {}).__inc || 0) + n);
      }
      return [...ops, ...Object.values(g).map(x => ({ op: 'upd', ...x }))];
    }
  };
}
const F = (fx, col, id, path, n) => { n = num(n); if (n) fx.push([col, id, path, n]); };
const cashFx = (fx, mode, amt, pid) => { if (mode === 'cash') F(fx, 'meta', 'cash', 'p.' + pid, amt); else if (mode === 'online') F(fx, 'meta', 'cash', 'bank', amt); };
async function run(b, msg) {
  try { await S.store.commit(b.build()); if (msg && !S.quiet) toast(msg); return true; }
  catch (e) { console.error(e); toast(e.message || 'Error'); return false; }
}

/* ---------------- derived numbers ---------------- */
function stockTotals() {
  const wh = stockDoc().wh || {}; let filled = 0, empty = 0;
  for (const w of settings().warehouses) { filled += num(wh[w.id]?.filled); empty += num(wh[w.id]?.empty); }
  const factory = num(stockDoc().factory); const held = S.customers.reduce((a, c) => a + num(c.held), 0);
  const total = num(stockDoc().total);
  return { filled, empty, factory, held, total, sum: filled + empty + factory + held };
}
function cashTotals() {
  const c = cashDoc(); const per = {}; let sum = 0;
  for (const p of settings().partners) { per[p.id] = num(c.p?.[p.id]); sum += per[p.id]; }
  return { per, bank: num(c.bank), sum, all: sum + num(c.bank) };
}
function periodSummary(from, to, orders, txs, moves) {
  const sum = { delivered: 0, bill: 0, cash: 0, online: 0, expense: 0, expCat: {}, depIn: 0, depOut: 0, filled: 0, capital: 0, drawing: 0, byP: {} };
  const P_ = id => sum.byP[id] = sum.byP[id] || { jars: 0, cash: 0, online: 0, expense: 0 };
  for (const o of orders) if (o.status === 'delivered' && o.deliveredAt >= from && o.deliveredAt <= to) { sum.delivered += num(o.qty); sum.bill += num(o.bill); P_(o.deliveredBy).jars += num(o.qty); }
  for (const x of txs) {
    if (x.void || x.at < from || x.at > to) continue;
    const a = num(x.amount);
    if (x.type === 'sale' || x.type === 'payment') { if (x.mode === 'online') { sum.online += a; P_(x.partner).online += a; } else { sum.cash += a; P_(x.partner).cash += a; } }
    if (x.type === 'expense') { sum.expense += a; sum.expCat[x.cat || 'Other'] = (sum.expCat[x.cat || 'Other'] || 0) + a; P_(x.partner).expense += a; }
    if (x.type === 'deposit') sum.depIn += a;
    if (x.type === 'refund') sum.depOut += a;
    if (x.type === 'capital') sum.capital += a;
    if (x.type === 'drawing') sum.drawing += a;
  }
  for (const m of moves) if (!m.void && m.type === 'fromFactory' && m.at >= from && m.at <= to) sum.filled += num(m.qty);
  return sum;
}

async function loadHist(id) {
  R.hist = { id };
  try {
    const [os, ts, ms] = await Promise.all([S.store.byCust('orders', id), S.store.byCust('txs', id), S.store.byCust('moves', id)]);
    R.hist = { id, os, ts, ms };
  } catch (e) { console.error(e); R.hist = { id, os: [], ts: [], ms: [] }; }
  if (R.page === 'cust' && R.cust === id) render();
}
function histRows(id) {
  const h = R.hist || {}; const mg = (old, live) => { const m = new Map(); (old || []).forEach(x => m.set(x.id, x)); live.filter(x => x.cust === id).forEach(x => m.set(x.id, x)); return [...m.values()]; };
  return buildHist(mg(h.os, S.orders), mg(h.ts, S.txs), mg(h.ms, S.moves));
}
function buildHist(os, ts, ms) {
  const rows = [];
  for (const o of os) {
    if (o.status === 'delivered' || o.status === 'void') rows.push({ at: o.deliveredAt || o.at, kind: 'deliver', rec: o, col: 'orders' });
    else if (o.status === 'pending' || o.status === 'cancelled') rows.push({ at: o.at, kind: 'order', rec: o, col: 'orders' });
  }
  for (const x of ts) if (x.type !== 'sale') rows.push({ at: x.at, kind: x.type, rec: x, col: 'txs' });
  for (const m of ms) rows.push({ at: m.at, kind: 'custReturn', rec: m, col: 'moves' });
  return rows.sort((a, b) => b.at - a.at);
}
function histLabel(r) {
  const x = r.rec;
  if (r.kind === 'deliver') return [`${t('Delivered')}: ${x.qty} ${t('jars')}${x.returned ? `, ${t('Empty')} ${x.returned}` : ''}`, `${t('Bill amount')} ${money(x.bill)} · ${t('Amount received')} ${money(x.paid)} (${t(x.mode)})`];
  if (r.kind === 'order') return [`${t('New order')}: ${x.qty} ${t('jars')}`, x.status === 'cancelled' ? t('Cancelled') : t('Pending')];
  if (r.kind === 'payment') return [`${t('Payment')}: ${money(x.amount)}`, t(x.mode)];
  if (r.kind === 'deposit') return [`${t('Deposit')}: ${money(x.amount)}`, t(x.mode)];
  if (r.kind === 'refund') return [`${t('Close account')}: ${t('Refund to customer')} ${money(x.amount)}`, `${t('Jars returned')} ${x.returned}`];
  if (r.kind === 'custReturn') return [`${t('Jar return')}: ${x.qty}`, whName(x.wh)];
  return [r.kind, ''];
}
function histList(rows) {
  if (!rows || !rows.length) return `<div class="list"><div class="empty">${t('No history yet')}</div></div>`;
  return `<div class="list">${rows.map(r => { const [a, b] = histLabel(r); const v = r.rec.void || r.rec.status === 'void';
    return `<div class="item ${v ? 'void' : ''}" style="cursor:default"><div class="grow"><div class="t">${esc(a)}</div><div class="s">${esc(b)} · ${fmtDT(r.at)} · ${esc(partnerName(r.rec.deliveredBy || r.rec.by))}</div></div></div>`; }).join('')}</div>`;
}

async function makeReport(fromV, toV) {
  const from = new Date(fromV + 'T00:00:00').getTime(), to = new Date(toV + 'T23:59:59').getTime();
  const [orders, txs, moves] = await Promise.all([S.store.range('orders', from - 400 * DAY, to), S.store.range('txs', from, to), S.store.range('moves', from, to)]);
  const sm = periodSummary(from, to, orders, txs, moves);
  const newC = S.customers.filter(c => c.at >= from && c.at <= to).length;
  const perCust = {};
  for (const o of orders) if (o.status === 'delivered' && o.deliveredAt >= from && o.deliveredAt <= to) { const p = perCust[o.cust] = perCust[o.cust] || { jars: 0, bill: 0, paid: 0 }; p.jars += num(o.qty); p.bill += num(o.bill); }
  for (const x of txs) if (!x.void && x.cust && (x.type === 'sale' || x.type === 'payment')) { const p = perCust[x.cust] = perCust[x.cust] || { jars: 0, bill: 0, paid: 0 }; p.paid += num(x.amount); }
  const rowsC = Object.entries(perCust).map(([id, v]) => ({ c: custById(id) || { name: '?' }, ...v })).sort((a, b) => b.jars - a.jars);
  const period = `${fmtDate(from)} – ${fmtDate(to)}`;
  const summary = [[t('Delivered jars'), sm.delivered], [t('Sales'), money(sm.bill)], [t('Cash collected'), money(sm.cash)], [t('Online collected'), money(sm.online)],
    [t('Expenses'), money(sm.expense)], [t('Net'), money(sm.bill - sm.expense)], [t('Jars filled'), sm.filled], [t('New customers'), newC],
    [t('Deposits received'), money(sm.depIn)], [t('Deposits refunded'), money(sm.depOut)], [t('Partner investment'), money(sm.capital)], [t('Partner withdrawal'), money(sm.drawing)]];
  const tbl = (head, rows) => `<div class="scroll" style="margin-top:8px"><table class="t"><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const html = `<h3>${t('Summary')} · ${esc(period)}</h3>${tbl([t('Summary'), ''], summary)}
   <h3>${t('Expenses')}</h3>${tbl([t('Category'), t('Amount')], Object.entries(sm.expCat).map(([k, v]) => [t(k), money(v)]))}
   <h3>${t('By partner')}</h3>${tbl([t('Partner'), t('Delivered jars'), t('Cash collected'), t('Online collected'), t('Expenses')], Object.entries(sm.byP).map(([k, v]) => [partnerName(k), v.jars, money(v.cash), money(v.online), money(v.expense)]))}
   <h3>${t('Customer-wise')}</h3>${tbl([t('Customer'), t('Delivered jars'), t('Sales'), t('Collected'), t('Held now'), t('Due now')], rowsC.map(r => [r.c.name, r.jars, money(r.bill), money(r.paid), num(r.c.held), money(r.c.due)]))}`;
  R.rep = html + `<button class="btn" data-act="printRep" style="width:100%;margin-top:14px">${t('Export PDF')}</button>
   <div class="btns"><button class="btn ghost" data-act="csvCust">${t('Download customers (Excel)')}</button><button class="btn ghost" data-act="csvTx">${t('Download transactions (Excel)')}</button></div>`;
  R.repTx = txs.filter(x => !x.void).sort((a, b) => a.at - b.at);
  R.repPrint = `<h1>${t('Report')}</h1><div class="meta">${t('Period')}: ${esc(period)} · ${t('Generated')}: ${fmtDT(Date.now())} · ${esc(me().name)}</div>` + html.replace(/class="scroll"/g, '');
  R.rFrom = fromV; R.rTo = toV;
  render();
}

function downloadCsv(name, rows) {
  const csv = '\ufeff' + rows.map(r => r.map(v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

    else if (!need(num(f.qty) > 0, t('Enter a number above 0'))) return false;
    if (type === 'transfer' && !need(f.from !== f.to, t('Same warehouse'))) return false;
    if (type === 'toFactory' && num(f.qty) > num(wh[f.wh]?.empty) && !confirm(t('Not enough jars in this warehouse') + '. ' + t('Save') + '?')) return false;
    if (type === 'fromFactory' && f.mode === 'credit') f.price = 0;
    if (type === 'buy' && f.mode === 'credit') f.price = 0;
    return A.stock(type, f);
  });
}

    case 'pref': P[el.dataset.k] = el.dataset.v; saveP(); applyTheme(); render(); break;
    case 'printRep': printHtml(R.repPrint); break;

document.addEventListener('submit', async e => {

/* ---------------- boot ---------------- */
function onData(snap) {
  S.meta = snap.meta || {}; S.customers = snap.customers; S.orders = snap.orders; S.txs = snap.txs; S.moves = snap.moves; S.logs = snap.logs;
  S.loaded = true;
  if (!(document.activeElement && document.activeElement.form && document.activeElement.form.id === 'setForm')) scheduleRender();
}
let rT; function scheduleRender() { clearTimeout(rT); rT = setTimeout(render, 30); }
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function startPractice() {
  if (S.store) return;
  S.store = DemoStore(); S.user = { email: 'practice' };
  S.store.init(onData);
  if (S.store.fresh) await seedDemo();
}
async function boot() {
  applyTheme();
  if (DEMO) { if (P.practice) await startPractice(); render(); return; }
  render();
  const v = '10.12.2';
  try {
    await loadScript(`https://cdn.jsdelivr.net/npm/firebase@${v}/firebase-app-compat.js`);
    await Promise.all([loadScript(`https://cdn.jsdelivr.net/npm/firebase@${v}/firebase-auth-compat.js`), loadScript(`https://cdn.jsdelivr.net/npm/firebase@${v}/firebase-firestore-compat.js`)]);
  } catch (e) { $('#app').innerHTML = '<div class="login"><p>Could not load. Check internet and reload.</p></div>'; return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  const fs0 = firebase.firestore();
  try { fs0.settings({ ignoreUndefinedProperties: true, merge: true }); } catch (e) {}
  try { fs0.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}
  // public list of registered partner names (no secrets) so the login screen can show them
  fs0.doc('public/slots').onSnapshot(d => { S.slots = d.exists ? d.data() : {}; if (!S.user) refreshSlots(); else scheduleRender(); }, () => {});
  firebase.auth().onAuthStateChanged(u => {
    S.user = u;
    if (u && !S.store) { S.store = FireStore(); S.store.init(onData); }
    if (!u) { S.loaded = false; if (S.store) location.reload(); }
    render();
  });
}
if ('serviceWorker' in navigator && location.protocol === 'https:' && !DEMO) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
