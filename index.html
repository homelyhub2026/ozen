<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e2457">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>OZEN</title>
<meta name="apple-mobile-web-app-title" content="OZEN">
<meta name="application-name" content="OZEN">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0e2457; --brand:#0b3fa8; --sky:#14a6e6; --sky2:#5cc7f2; --green:#45b649;
  --ink:#10234f; --ink2:#41557e; --muted:#6c7c99;
  --water:#14a6e6; --water-soft:#e3f3fc; --paper:#f1f6fc; --card:#ffffff; --line:#dde6f2;
  --ok:#2f9a43; --warn:#b5760a; --bad:#c53a3a; --warn-soft:#fdf2dc; --bad-soft:#fbe5e5; --ok-soft:#e2f5e3;
  --nav:#ffffff; --shadow:0 1px 2px rgba(14,36,87,.06),0 4px 14px rgba(14,36,87,.05);
  --band:linear-gradient(135deg,#0e2457 0%,#0b3fa8 55%,#1489dd 100%);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#e6eefb; --ink2:#a8bbdc; --muted:#8091b2; --water-soft:#14284f; --paper:#09142b; --card:#0f1e3d; --line:#1f3360; --nav:#0c1933;
  --warn-soft:#3a2d10; --bad-soft:#3f1a1f; --ok-soft:#123220; --shadow:none; --brand:#3b74e6;
}}
:root[data-theme="dark"]{
  --ink:#e6eefb; --ink2:#a8bbdc; --muted:#8091b2; --water-soft:#14284f; --paper:#09142b; --card:#0f1e3d; --line:#1f3360; --nav:#0c1933;
  --warn-soft:#3a2d10; --bad-soft:#3f1a1f; --ok-soft:#123220; --shadow:none; --brand:#3b74e6;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Mukta","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3,.v,.n,.brandname{font-family:"Poppins","Mukta",system-ui,sans-serif}

/* brand header */
.top{position:sticky;top:0;z-index:5;background:var(--band);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;margin-top:calc(-1 * env(safe-area-inset-top,0px));box-shadow:0 2px 10px rgba(14,36,87,.18)}
.top .mark{width:40px;height:40px;border-radius:50%;background:#fff;flex:none;object-fit:contain;padding:3px;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.top .ttl{flex:1;min-width:0;line-height:1.15}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who{font-size:12.5px;text-align:right;line-height:1.25;flex:none;max-width:38%}
.top .who b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);border-radius:20px;padding:1px 8px;font-size:11.5px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7be08a}
.dot.off{background:#ffc94d}
main{max-width:760px;margin:0 auto;padding:4px 16px 110px}
.demo-banner{background:var(--warn-soft);color:var(--ink);font-size:14px;padding:8px 12px;border-radius:10px;margin:12px 0}

/* home hero: blue band continuing from header, shelf card floats on it */
.hero{margin:0 -16px;padding:24px 20px 74px;color:#fff;position:relative;overflow:hidden;min-height:220px;background:#0e2457}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(90deg,rgba(14,36,87,.95) 0%,rgba(11,52,150,.78) 42%,rgba(11,63,168,.12) 78%,rgba(11,63,168,0) 100%),var(--poster);background-size:cover;background-position:70% 38%}
.hero::after{content:"";position:absolute;left:-5%;right:-5%;bottom:-1px;height:46px;background:var(--paper);border-radius:55% 45% 0 0/100% 100% 0 0}
.hero>*{position:relative;z-index:1;max-width:62%}
.hero .greet{font-size:14px;opacity:.9}
.hero .big{font-family:"Poppins","Mukta",sans-serif;font-size:23px;font-weight:700;line-height:1.2;margin:2px 0 6px;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.hero .tagl{font-size:15px;opacity:.95;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:3px 10px;border-radius:20px;backdrop-filter:blur(4px)}
@media (min-width:960px){.hero{margin:0;border-radius:0 0 28px 28px;min-height:270px;padding:36px 36px 84px}.hero .big{font-size:30px}.hero>*{max-width:55%}}
.shelf{background:var(--card);border-radius:20px;padding:16px 10px 10px;box-shadow:var(--shadow);border:1px solid var(--line);margin-top:-44px;position:relative;z-index:2}
.shelf-jars{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;align-items:end}
.jarbox{text-align:center}
.jarbox svg{width:100%;max-width:76px;height:auto;display:block;margin:0 auto}
.jarbox .n{font-size:24px;font-weight:700;line-height:1;margin-top:6px;color:var(--ink)}
.jarbox .l{font-size:13px;color:var(--muted);line-height:1.2;margin-top:3px}
.jar .shell{fill:none;stroke:var(--brand);stroke-width:2.2}
.jar .cap{fill:var(--brand)}
.jar .glass{fill:var(--water-soft)}
.jar .band{fill:#fff;opacity:.28}
.jar .label{fill:#fff;stroke:var(--brand);stroke-width:.8}
.jar .drop{fill:#14a6e6}
.jar .lt{font:800 8.2px Poppins,Mukta,sans-serif;fill:#0b3fa8;letter-spacing:.2px}
.jar .water{fill:url(#wgrad)}
.jar.dry .water{fill:#b9c6d9}
.jar.away .water{fill:var(--sky2)}
.jar.out .water{fill:var(--green);opacity:.85}
.shelf-foot{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);margin-top:12px;padding:8px 6px 0;font-size:14px}

.alert{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.alert.warn{background:var(--warn-soft)} .alert.bad{background:var(--bad-soft)} .alert.ok{background:var(--ok-soft)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow);font:inherit;color:inherit}
.stat .v{font-size:20px;font-weight:700;line-height:1.2}
.stat .k{font-size:13px;color:var(--muted)}
.stat.wide{grid-column:1/-1}
.stat.accent{border-left:4px solid var(--sky)}
.stat.accent2{border-left:4px solid var(--green)}

.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;gap:11px;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;line-height:1.25}
.item .s{font-size:13px;color:var(--muted);line-height:1.3}
.item.void{opacity:.5} .item.void .t{text-decoration:line-through}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;background:var(--brand)}
.av.c1{background:#0b3fa8}.av.c2{background:#1489dd}.av.c3{background:#2f9a43}.av.c4{background:#0e2457}.av.c5{background:#0f8fa3}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:1px 9px;border-radius:20px;background:var(--water-soft);color:var(--ink);white-space:nowrap}
.chip.warn{background:var(--warn-soft)} .chip.bad{background:var(--bad-soft)} .chip.ok{background:var(--ok-soft)}
.amt{font-weight:700;white-space:nowrap}
.amt.plus{color:var(--ok)} .amt.minus{color:var(--bad)}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}

.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--brand);color:#fff;cursor:pointer;min-height:44px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;border-radius:28px;padding:13px 20px;background:linear-gradient(135deg,#0b3fa8,#1489dd);box-shadow:0 6px 18px rgba(11,63,168,.35)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--nav);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--brand);font-weight:700}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--green)}
@media (min-width:960px){
  nav.tabs{top:0;right:auto;width:96px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:calc(80px + env(safe-area-inset-top,0px))}
  nav.tabs button{flex:0;padding:14px 4px}
  nav.tabs button.on::before{top:20%;bottom:20%;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  .top{padding-left:112px}
  main{margin-left:max(96px,calc(50vw - 380px + 48px))}
  .fab{bottom:28px}
}

h2{font-size:21px;margin:18px 0 10px;font-weight:700;letter-spacing:-.01em}
h3{font-size:16px;margin:22px 0 8px;font-weight:600;color:var(--ink2)}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0} .right{text-align:right}

.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 6px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--brand);color:#fff}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}

.profile-head{background:var(--band);color:#fff;border-radius:18px;padding:16px;margin-top:8px;box-shadow:0 6px 18px rgba(11,63,168,.2)}
.profile-head h2{margin:0;color:#fff}
.profile-head .s{opacity:.85;font-size:14px}
.profile-head .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.profile-head .acts a{background:rgba(255,255,255,.16);color:#fff;text-decoration:none;text-align:center;border-radius:10px;padding:9px 4px;font-weight:600;font-size:14px}

table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-weight:600;color:var(--muted);font-size:13px}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}

.veil{position:fixed;inset:0;background:rgba(9,20,43,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:4px solid var(--sky)}
@media (min-width:600px){.veil{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin-top:0}
.f{display:block;margin:0 0 12px}
.f>span{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);min-height:44px}
.f textarea{min-height:70px}
.f small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.f2>*{min-width:0}
.sheet{overflow-x:hidden}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(72px + env(safe-area-inset-top,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-weight:600;max-width:90vw}

.loginwrap{min-height:100vh;position:relative;overflow:hidden;background:#0e2457}
.loginwrap::before{content:"";position:fixed;inset:0;background-image:linear-gradient(180deg,rgba(14,36,87,.55) 0%,rgba(14,36,87,.25) 40%,rgba(9,20,43,.88) 100%),var(--poster);background-size:cover;background-position:66% center}
.login{max-width:420px;margin:0 auto;padding:30px 20px 40px;position:relative}
.login .logo{width:132px;height:132px;border-radius:50%;background:#fff;display:block;margin:0 auto 10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.login .ozen{display:block;width:220px;max-width:70%;margin:0 auto 4px;border-radius:10px;background:#fff;padding:6px 10px}
.login .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 40px rgba(0,0,0,.35);margin-top:22px}
.whogrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who-opt{position:relative;cursor:pointer}
.who-opt input{position:absolute;opacity:0;pointer-events:none}
.who-opt span{display:block;text-align:center;padding:10px 6px;border:1px solid var(--line);border-radius:10px;font-weight:600;background:var(--paper)}
.who-opt input:checked+span{background:var(--brand);color:#fff;border-color:var(--brand)}
.who-opt input:focus-visible+span{outline:3px solid var(--sky);outline-offset:2px}
.login .tag{text-align:center;color:#fff;font-size:16px;margin:6px 0 0;text-shadow:0 1px 6px rgba(0,0,0,.45)}

#print{display:none}
@media print{
  @page{margin:12mm}
  body{background:#fff;color:#000}
  #app,nav,.fab,.veil,.toast{display:none!important}
  #print{display:block;font-family:"Mukta","Poppins",sans-serif;color:#111}
  #print .lh{display:flex;align-items:center;gap:12px;border-bottom:3px solid #0b3fa8;padding-bottom:8px;margin-bottom:10px}
  #print .lh img.l{width:58px;height:58px}
  #print .lh img.o{height:46px;margin-left:auto}
  #print .lh .c{font-size:18px;font-weight:700;color:#0e2457;font-family:"Poppins","Mukta",sans-serif}
  #print .lh .a{font-size:11px;color:#333}
  #print h1{font-size:17px;margin:6px 0 2px;color:#0b3fa8}
  #print h3{font-size:14px;margin:12px 0 2px;color:#0e2457}
  #print table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
  #print th{background:#e8f1fc;color:#0e2457}
  #print th,#print td{border:1px solid #b9c7da;padding:4px 6px;text-align:right}
  #print th:first-child,#print td:first-child{text-align:left}
  #print .meta{font-size:12px;color:#333;margin:2px 0 8px}
  #print .foot{margin-top:14px;font-size:10.5px;color:#666;border-top:1px solid #ccc;padding-top:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.pill{border:0;cursor:pointer;color:#fff;font:inherit;font-size:11.5px}
.pill.ok{background:rgba(123,224,138,.25)} .pill.warn{background:rgba(255,201,77,.35)} .pill.bad{background:rgba(255,120,120,.45)}
.sheet .btns{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--card);margin:12px -16px -18px;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet h3{margin:14px 0 6px}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:#c53a3a;color:#fff;font-size:11px;line-height:18px;text-align:center}
label.row{flex-wrap:nowrap;align-items:flex-start;gap:10px} label.row input[type=checkbox]{margin-top:4px;flex:none;width:18px;height:18px}
table.t.xl{font-size:13px;white-space:nowrap}table.t.xl th,table.t.xl td{text-align:left!important;padding:6px 10px}table.t.xl td.n{text-align:right!important;font-variant-numeric:tabular-nums}table.t.xl tbody tr:nth-child(even) td{background:var(--paper,#f6f9fe)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.grid2{grid-template-columns:1fr}}

/* ================= OZEN glass theme (same look as the website). Design only: no data or logic changes. ================= */
:root{
  --brand:#087aa8; --sky:#1bb6e3; --sky2:#7fd3f0; --green:#6cc04a; --navy:#0d2733;
  --ink:#0d2733; --ink2:#3f566b; --muted:#566d7f; --water:#1bb6e3; --water-soft:#dff3fa;
  --paper:#eef6fa; --card:rgba(255,255,255,.80); --line:rgba(13,39,51,.10); --nav:rgba(255,255,255,.72);
  --shadow:0 18px 40px -30px rgba(8,80,100,.55),inset 0 1px 0 rgba(255,255,255,.9);

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#e8f3f7; --ink2:#b4c9d3; --muted:#93aab6; --water-soft:#123a48; --paper:#06171f; --card:rgba(10,34,44,.78); --line:rgba(255,255,255,.10);
  --nav:rgba(8,28,36,.78); --shadow:0 18px 40px -30px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06); --brand:#3fb3e0; --veil:rgba(4,20,28,.82); --solid:#0b2530; --topfg:#e8f3f7;
}}
:root[data-theme="dark"]{
  --ink:#e8f3f7; --ink2:#b4c9d3; --muted:#93aab6; --water-soft:#123a48; --paper:#06171f; --card:rgba(10,34,44,.78); --line:rgba(255,255,255,.10);
  --nav:rgba(8,28,36,.78); --shadow:0 18px 40px -30px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06); --brand:#3fb3e0; --veil:rgba(4,20,28,.82); --solid:#0b2530; --topfg:#e8f3f7;
}
body{background:var(--paper)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(var(--veil),var(--veil)),var(--glassbg) 40% 46%/cover no-repeat}
h1,h2,h3,.v,.n,.brandname,.hero .big{font-family:"Manrope","Mukta",system-ui,sans-serif;letter-spacing:-.02em}
/* header: light glass with the brand swoosh */
.top{background:var(--nav);color:var(--topfg);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);box-shadow:0 10px 30px -22px rgba(8,80,100,.6);border-bottom:1px solid var(--line)}
.top::after{content:"";position:absolute;left:66px;bottom:6px;width:120px;height:6px;background:var(--green);clip-path:polygon(0 70%,100% 0,100% 30%,0 100%);opacity:.9}
.top .mark{background:#f1f1f1;box-shadow:0 0 0 2px rgba(8,122,168,.12)}
.top .sub{opacity:1;color:var(--muted)}
.pill{background:rgba(8,122,168,.12);color:var(--topfg)}
.dot{background:var(--green)}
/* bottom / side navigation */
nav.tabs{background:var(--nav);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-color:var(--line)}
nav.tabs button.on{color:var(--brand)}
/* cards and lists: frosted white */
.stat,.list,.scroll,.seg,.card2{background:var(--card);border-color:rgba(255,255,255,.75);box-shadow:var(--shadow);border-radius:18px}
:root[data-theme="dark"] .stat,:root[data-theme="dark"] .list,:root[data-theme="dark"] .scroll,:root[data-theme="dark"] .seg,:root[data-theme="dark"] .card2{border-color:var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stat,:root:not([data-theme="light"]) .list,:root:not([data-theme="light"]) .scroll,:root:not([data-theme="light"]) .seg,:root:not([data-theme="light"]) .card2{border-color:var(--line)}}
.stat.accent{border-left:4px solid var(--sky)} .stat.accent2{border-left:4px solid var(--green)}
.item:hover{background:rgba(27,182,227,.06)}
/* buttons */
.btn{border-radius:999px;background:var(--brand);box-shadow:0 10px 22px -14px rgba(8,122,168,.9);transition:transform .15s,filter .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);border:1px solid var(--line);box-shadow:none}
.btn.bad{background:var(--bad);box-shadow:none}
.btn.sm{border-radius:999px}
.seg{border-radius:999px;padding:4px}.seg button{border-radius:999px}.seg button.on{background:var(--brand)}
/* forms and sheets stay solid for easy reading */
.sheet{background:var(--solid);border-top:0;border-radius:26px 26px 0 0;box-shadow:0 -20px 60px -30px rgba(8,80,100,.6)}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:var(--line);margin:-6px auto 12px}
.sheet .btns{background:var(--solid)}
.f input,.f select,.f textarea{background:var(--solid);border-radius:12px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(27,182,227,.2);outline:0}
.chip{background:var(--water-soft)}
/* home banner in brand teal */
.hero::before{background-image:linear-gradient(90deg,rgba(6,70,92,.95) 0%,rgba(8,122,168,.78) 42%,rgba(8,122,168,.12) 78%,rgba(8,122,168,0) 100%),var(--poster)!important}
.hero::after{background:transparent;backdrop-filter:none}
.hero{border-radius:0 0 30px 30px;margin-bottom:6px}
/* gentle entrance */
main>*{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

.rjar{position:relative;display:block;width:100%;max-width:78px;aspect-ratio:556/1031;margin:0 auto;transition:transform .25s}
.jarbox:hover .rjar{transform:translateY(-3px)}
.rjar i{position:absolute;inset:0;display:block}
.rj-img{background:var(--rjar) center/100% 100% no-repeat;filter:drop-shadow(0 8px 10px rgba(8,80,100,.25))}
.rj-fill{z-index:1;-webkit-mask:var(--rjmask) center/100% 100% no-repeat;mask:var(--rjmask) center/100% 100% no-repeat}
.rj-fill::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--lv);background:linear-gradient(180deg,rgba(255,255,255,.95) 0 2px,rgba(27,182,227,.32) 3px,rgba(8,122,168,.38));transition:height .8s cubic-bezier(.3,.7,.2,1)}
.rj-img{z-index:2;mix-blend-mode:normal;opacity:.96}
.rjar.dry .rj-img{filter:saturate(.25) brightness(1.08) drop-shadow(0 8px 10px rgba(8,80,100,.18));opacity:.8}
.rjar.dry .rj-fill::before{background:linear-gradient(180deg,rgba(255,255,255,.9) 0 2px,rgba(150,170,185,.25) 3px)}
.rjar.away .rj-img{opacity:.85}
.rj-badge{z-index:3;inset:auto -4px 6% auto!important;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 4px 10px -4px rgba(8,80,100,.6);display:grid;place-items:center}

.jarbox .n{font-family:"Manrope","Mukta",sans-serif;font-weight:800;letter-spacing:-.03em}
.shelf{border-radius:24px;padding:18px 10px 12px}
.hero{color:var(--ink);background:#d8edf9;min-height:236px;padding:26px 20px 80px}
.hero::before{background-image:linear-gradient(90deg,rgba(244,250,253,.94) 0%,rgba(244,250,253,.78) 42%,rgba(244,250,253,.05) 72%),var(--rjar),var(--scene)!important;background-size:auto,auto 150%,cover!important;background-position:0 0,right 8% top 18px,center 46%!important;background-repeat:no-repeat!important}
@media(min-width:700px){.hero::before{background-size:auto,auto 170%,cover!important;background-position:0 0,right 12% top 10px,center 46%!important}}
.hero .greet{color:var(--muted);opacity:1;font-weight:600}
.hero .big{color:var(--ink);text-shadow:none;font-size:26px;font-weight:800}
.hero .big::after{content:"";display:block;width:150px;height:8px;margin-top:6px;background:var(--green);clip-path:polygon(0 75%,100% 0,100% 35%,0 100%)}
.hero .tagl{background:rgba(255,255,255,.7);border-color:rgba(255,255,255,.95);color:#2f7d1f;font-weight:600;opacity:1}
:root[data-theme="dark"] .hero::before{background-image:linear-gradient(90deg,rgba(4,22,30,.92) 0%,rgba(4,22,30,.7) 42%,rgba(4,22,30,.05) 72%),var(--rjar),var(--scene)!important}
:root[data-theme="dark"] .hero .tagl{background:rgba(10,34,44,.7);border-color:rgba(255,255,255,.12);color:#9be07a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero::before{background-image:linear-gradient(90deg,rgba(4,22,30,.92) 0%,rgba(4,22,30,.7) 42%,rgba(4,22,30,.05) 72%),var(--rjar),var(--scene)!important}:root:not([data-theme="light"]) .hero .tagl{background:rgba(10,34,44,.7);border-color:rgba(255,255,255,.12);color:#9be07a}}
.top h1::after{content:" · OZEN";font-weight:600;color:var(--brand)}

/* delivery filters + digital bill */
.dfil{margin-top:10px}
.dfil .seg{flex-wrap:wrap}
.dsum{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 2px 0;font-size:14px;color:var(--muted)}
.dsum b{color:var(--ink)}.dsum .bad b{color:var(--bad)}
.bill-card{border-radius:22px;overflow:hidden;background:#fff;color:#0d2733;border:1px solid #e3edf2;box-shadow:0 20px 40px -30px rgba(8,80,100,.6);margin:4px 0 12px}
.bc-head{display:flex;gap:12px;align-items:center;padding:16px;color:#fff;background:linear-gradient(120deg,#06607f,#087aa8 60%,#1bb6e3);position:relative}
.bc-head::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:8px;background:#6cc04a;clip-path:polygon(0 70%,100% 0,100% 40%,0 100%)}
.bc-head img{width:48px;height:48px;border-radius:50%;background:#f1f1f1;padding:3px;flex:none}
.bc-head b{display:block;font-size:16px}.bc-head span{display:block;font-size:13px;opacity:.95}.bc-head small{display:block;font-size:11.5px;opacity:.85}
.bc-title{display:flex;justify-content:space-between;align-items:baseline;padding:16px 16px 4px}
.bc-title span{font:800 19px "Manrope","Mukta",sans-serif}.bc-title b{color:#087aa8;font-size:13px}
.bc-meta{display:flex;justify-content:space-between;gap:12px;padding:6px 16px 10px}
.bc-meta small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#566d7f}.bc-meta b{display:block;font-size:16px}.bc-meta span{font-size:13px;color:#566d7f}.bc-meta .r{text-align:right}
.bc-t{width:calc(100% - 32px);margin:0 16px;border-collapse:collapse;font-size:14px}
.bc-t th{background:#eef7fb;color:#566d7f;font-weight:700;text-align:right;padding:8px}.bc-t th:first-child{text-align:left;border-radius:10px 0 0 10px}.bc-t th:last-child{border-radius:0 10px 10px 0}
.bc-t td{padding:9px 8px;border-bottom:1px solid #eef3f6;text-align:right}.bc-t td:first-child{text-align:left}.bc-t td:last-child{font-weight:800}
.bc-sum{padding:10px 16px;display:grid;gap:4px;margin-left:auto;max-width:330px}
.bc-sum div{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:#3f566b}.bc-sum b{color:#0d2733}
.bc-sum .big{margin-top:6px;padding:10px 12px;border-radius:12px;font-size:15px}.bc-sum .big.due{background:#fdecec}.bc-sum .big.due b,.bc-sum .big.due span{color:#b42f2f}.bc-sum .big.ok{background:#e7f6e1}.bc-sum .big.ok b,.bc-sum .big.ok span{color:#2f7d1f}
.bc-jars{display:flex;flex-wrap:wrap;gap:6px 16px;margin:4px 16px 0;padding:10px 12px;border-radius:12px;background:#f4f8fa;font-size:13px;color:#3f566b}.bc-jars b{color:#0d2733}
.bc-foot{display:grid;gap:3px;padding:12px 16px 16px;font-size:13px;color:#3f566b}.bc-foot .ty{color:#087aa8;font-weight:800;font-size:15px}.bc-foot small{color:#7a8f9d;font-size:11px}
.bill-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bill-acts .btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.bill-acts .btn:first-child{grid-column:1/-1}
@media print{.bill-card{box-shadow:none;border:1px solid #ccc}}

.bno{display:inline-block;padding:0 7px;border-radius:7px;background:rgba(8,122,168,.12);color:var(--brand);font-weight:800;font-size:12px}
.bno.chl{background:rgba(214,120,20,.14);color:#a85a00}
.bc-vch{margin:-2px 16px 4px;font-size:13px;color:#566d7f}.bc-vch b{color:#0d2733}
</style>

/* ---------------- Nepali (BS) calendar ---------------- */
const BS_START = 2075, BS_AD0 = Date.UTC(2018, 3, 14); // 2075-01-01 BS = 2018-04-14 AD
// 2083: Asoj 31 and Mangsir 29 days (checked against the Nepali calendar: Kartik 1 = 18 Oct, Poush 1 = 16 Dec 2026)
const BS = [
 [31,31,32,31,31,31,30,29,30,29,30,30],[31,32,31,32,31,30,30,30,29,29,30,30],
 [31,32,31,32,31,30,30,30,29,30,29,31],[31,31,31,32,31,31,30,29,30,29,30,30],
 [31,31,32,31,31,31,30,29,30,29,30,30],[31,32,31,32,31,30,30,30,29,29,30,30],
 [31,32,31,32,31,30,30,30,29,30,29,31],[30,32,31,32,31,30,30,30,29,30,30,30],
 [31,31,32,31,31,31,30,29,29,30,30,30],[31,31,32,31,31,30,30,30,29,30,30,30],
 [31,32,31,32,30,31,30,30,29,30,30,30],[30,32,31,32,31,30,30,30,29,30,30,30],
 [31,31,32,31,31,31,30,30,29,30,30,30],[30,31,32,32,30,31,30,30,29,30,30,30],
 [30,32,31,32,31,30,30,30,29,30,30,30]
];
const BS_M_NE = ['बैशाख','जेठ','असार','साउन','भदौ','असोज','कात्तिक','मंसिर','पुस','माघ','फागुन','चैत'];
const BS_M_EN = ['Baisakh','Jestha','Asar','Shrawan','Bhadra','Ashoj','Kartik','Mangsir','Poush','Magh','Falgun','Chaitra'];
const KTM_OFF = 345 * 60000; // business days are Asia/Kathmandu (UTC+5:45, no daylight saving)
const ktm = ms => new Date(ms + KTM_OFF); // read with getUTC*
function adToBs(ms) {
  const d = ktm(ms);
  let days = Math.floor((Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - BS_AD0) / DAY);
  if (days < 0) return null;
  let y = 0;
  while (y < BS.length) { const yl = BS[y].reduce((a, b) => a + b, 0); if (days < yl) break; days -= yl; y++; }
  if (y >= BS.length) return null;
  let m = 0; while (days >= BS[y][m]) { days -= BS[y][m]; m++; }
  return [BS_START + y, m + 1, days + 1];
}
function fmtDate(ms) {
  if (!ms) return '';
  if (P.cal === 'bs') { const b = adToBs(ms); if (b) return `${b[2]} ${(P.lang === 'ne' ? BS_M_NE : BS_M_EN)[b[1] - 1]} ${b[0]}`; }
  return new Date(ms).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Kathmandu' });
}
function fmtDT(ms) { const d = ktm(ms); return fmtDate(ms) + ', ' + String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0'); }
const isoDay = ms => ktm(ms).toISOString().slice(0, 10);
const dayStart = ms => Math.floor((ms + KTM_OFF) / DAY) * DAY - KTM_OFF;
function monthStart(ms) {
  if (P.cal === 'bs') { const b = adToBs(ms); if (b) return dayStart(ms) - (b[2] - 1) * DAY; }
  const d = ktm(ms); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) - KTM_OFF;
}
const fromInputDay = v => { if (!v || v === isoDay(Date.now())) return Date.now(); const [y, m, d] = v.split('-').map(Number); return Date.UTC(y, m - 1, d, 12) - KTM_OFF; };

/* ---------------- data stores ---------------- */
const INC = n => ({ __inc: n });
const isInc = v => v && typeof v === 'object' && '__inc' in v;
function setPath(obj, path, v) {
  const ks = path.split('.'); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { if (!o[ks[i]] || typeof o[ks[i]] !== 'object') o[ks[i]] = {}; o = o[ks[i]]; }
  const last = ks[ks.length - 1];
  o[last] = isInc(v) ? Math.round((num(o[last]) + v.__inc) * 100) / 100 : v;
}
const get0 = (o, path) => path.split('.').reduce((x, k) => (x == null ? undefined : x[k]), o);
// fx entries are stored as {c,i,p,n} objects (Firestore does not allow arrays inside arrays)
const fxIn = e => Array.isArray(e) ? e : [e.c, e.i, e.p, e.n];
const fxOut = fx => Array.isArray(fx) ? fx.map(e => { const [c, i, p, n] = fxIn(e); return { c, i, p, n }; }) : fx;
const neg = fx => (fx || []).map(fxIn).map(([c, i, p, n]) => [c, i, p, -n]);
const clone = o => JSON.parse(JSON.stringify(o));

/* Every action produces one list of writes. Writes to the same document are merged into one
   write so a whole action is applied atomically (one transaction). */
function Ops() {
  const sets = [], upds = [], incs = [];
  return {
    sets, upds, incs,
    set(col, id, data) { sets.push({ col, id, data: { ...data, ...(Array.isArray(data.fx) ? { fx: fxOut(data.fx) } : {}) } }); },
    upd(col, id, data) { upds.push({ col, id, data: { ...data, ...(Array.isArray(data.fx) ? { fx: fxOut(data.fx) } : {}) } }); },
    fx(list) { incs.push(...list.map(fxIn)); }
  };
}
function compile(o) {
  const m = new Map();
  const ent = (col, id, kind) => {
    const k = col + '/' + id; let e = m.get(k);
    if (!e) { e = { col, id, kind, data: {} }; m.set(k, e); }
    if (kind === 'set') e.kind = 'set';
    return e;
  };
  for (const x of o.sets) { const e = ent(x.col, x.id, 'set'); e.data = { ...clone(x.data), ...e.data }; }
  for (const x of o.upds) { const e = ent(x.col, x.id, x.col === 'meta' ? 'merge' : 'update'); if (e.kind === 'set') { for (const [k, v] of Object.entries(x.data)) setPath(e.data, k, v); } else Object.assign(e.data, x.data); }
  for (const [c, i, p, n0] of o.incs) {
    const n = num(n0); if (!n) continue;
    const e = ent(c, i, c === 'meta' ? 'merge' : 'update');
    if (e.kind === 'set') setPath(e.data, p, INC(n));
    else { const cur = e.data[p]; e.data[p] = INC(Math.round(((cur && cur.__inc) || 0) * 100 + n * 100) / 100); }
  }
  return [...m.values()];
}
const rej = m => Object.assign(new Error(m), { rej: true });
const dupErr = () => Object.assign(new Error('duplicate'), { dup: true });

function DemoStore() {
  let db = store.get('jh_demo4', null);
  let cb;
  const fresh = !db;
  if (!db) db = { meta: { settings: { id: 'settings', ...DEF_SETTINGS }, stock: { id: 'stock', wh: {}, factory: 0, total: 0 }, cash: { id: 'cash', p: {}, bank: 0 }, pay: { id: 'pay' } } };
  const save = () => store.set('jh_demo4', db);
  const snap = () => ({
    meta: { ...(db.meta || {}) },
    customers: Object.values(db.customers || {}), orders: Object.values(db.orders || {}),
    txs: Object.values(db.txs || {}), moves: Object.values(db.moves || {}), logs: Object.values(db.logs || {}),
    requests: Object.values(db.requests || {}).filter(r => r.status === 'new'),
    fund: Object.values(db.fund || {})
  });
  const all = col => Object.values(db[col] || {});
  return {
    fresh,
    init(onChange) { cb = onChange; cb(snap()); },
    async txn(fn) {
      const T = { get: async (col, id) => { const d = (db[col] || {})[id]; return d ? clone(d) : null; } };
      const o = await fn(T);
      for (const w of compile(o)) {
        const c = db[w.col] = db[w.col] || {};
        if (w.kind === 'set') { const d = { id: w.id }; for (const [k, v] of Object.entries(w.data)) setPath(d, k, v); c[w.id] = d; }
        else { const d = c[w.id] = c[w.id] || { id: w.id }; for (const [k, v] of Object.entries(w.data)) setPath(d, k, v); }
      }
      save(); cb(snap()); return o.result;
    },
    async getDoc(col, id) { const d = (db[col] || {})[id]; return d ? clone(d) : null; },
    async range(col, from, to, f = 'at') { return all(col).filter(x => x[f] >= from && x[f] <= to).map(clone); },
    async since(col, from, f = 'at') { return all(col).filter(x => x[f] >= from).map(clone); },
    async byCust(col, id) { return all(col).filter(x => x.cust === id).map(clone); },
    async byAcc(acc) { return all('txs').filter(x => (x.acc || []).includes(acc)).map(clone); },
    async older(col, field, before, n) { return all(col).filter(x => x[field] != null && x[field] < before).sort((a, b) => b[field] - a[field]).slice(0, n).map(clone); },
    async allOf(col) { return all(col).map(clone); },
    async updateMany(col, list) { for (const [id, data] of list) Object.assign(db[col][id], data); save(); cb(snap()); },
    reset() { try { localStorage.removeItem('jh_demo4'); } catch (e) {} location.reload(); },
    async hasDeliveries() { return all('orders').some(o => o.status === 'delivered' && !o.seed); },
    async wipe() { for (const c of ['customers', 'orders', 'txs', 'moves', 'logs', 'requests']) db[c] = {}; const st = db.meta.settings; db.meta = { settings: st, stock: { id: 'stock', wh: {}, factory: 0, total: 0 }, cash: { id: 'cash', p: {}, bank: 0 }, pay: { id: 'pay' } }; save(); cb(snap()); }
  };
}

function FireStore() {
  const fs = firebase.firestore();
  const FV = firebase.firestore.FieldValue;
  const conv = d => { const o = {}; for (const [k, v] of Object.entries(d)) o[k] = isInc(v) ? FV.increment(v.__inc) : v; return o; };
  const nest = d => { const o = {}; for (const [k, v] of Object.entries(d)) { const ks = k.split('.'); let c = o; for (let i = 0; i < ks.length - 1; i++) c = c[ks[i]] = c[ks[i]] || {}; c[ks[ks.length - 1]] = isInc(v) ? FV.increment(v.__inc) : v; } return o; };
  const deepConv = v => isInc(v) ? FV.increment(v.__inc) : (v && typeof v === 'object' && !Array.isArray(v)) ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, deepConv(x)])) : v;
  const docs = s => s.docs.map(d => ({ ...d.data(), id: d.id }));
  // Customers are cached on the device; after the first load only changed customers are read.
  const CKEY = 'oz_cust3_' + (FIREBASE_CONFIG.projectId || '');
  const uMs = v => v && typeof v.toMillis === 'function' ? v.toMillis() : (typeof v === 'number' ? v : 0);
  const cust = store.get(CKEY, null) || { u: 0, docs: {} };
  let saveT; const saveCust = () => { clearTimeout(saveT); saveT = setTimeout(() => store.set(CKEY, cust), 800); };
  let snapRef = null, fireRef = () => {};
  const showCust = () => { if (!snapRef) return; snapRef.customers = Object.values(cust.docs); fireRef(); };
  return {
    async init(onChange) {
      const defs = { settings: { ...DEF_SETTINGS, schema: 2 }, stock: { wh: {}, factory: 0, total: 0 }, cash: { p: {}, bank: 0 } };
      for (const [k, v] of Object.entries(defs)) {
        const ref = fs.doc('meta/' + k);
        try { const g = await ref.get(); if (!g.exists) await ref.set(v); } catch (e) { console.warn(e); }
      }
      const snap = { meta: {}, customers: [], orders: [], txs: [], moves: [], logs: [] };
      let recentOrders = [], pendingOrders = [];
      const fire = () => onChange(snap);
      snapRef = snap; fireRef = fire;
      const err = e => { console.error(e); toast(e.message); };
      fs.collection('meta').onSnapshot(s => {
        snap.meta = {}; s.forEach(d => snap.meta[d.id] = d.data());
        const rid = (snap.meta.settings || {}).resetAt || 0;
        if (rid && rid !== (cust.resetAt || 0)) { clearTimeout(saveT); cust.docs = {}; cust.u = 0; cust.resetAt = rid; store.set(CKEY, { u: 0, docs: {}, resetAt: rid }); location.reload(); return; }
        fire();
      }, err);
      showCust();
      const cbase = fs.collection('customers');
      (cust.u ? cbase.where('u', '>', firebase.firestore.Timestamp.fromMillis(cust.u)) : cbase).onSnapshot(s => {
        s.docChanges().forEach(ch => {
          if (ch.type === 'removed') { delete cust.docs[ch.doc.id]; return; }   // deleted on the server
          const d = ch.doc.data({ serverTimestamps: 'estimate' }); const um = uMs(d.u);
          cust.docs[ch.doc.id] = { ...d, u: um, id: ch.doc.id };
          if (!ch.doc.metadata.hasPendingWrites && um > cust.u) cust.u = um;
        });
        saveCust(); showCust();
      }, err);
      // Customers removed on the server (e.g. after "Empty the app") are dropped from this device's copy.
      if (Object.keys(cust.docs).length) cbase.get({ source: 'server' }).then(q => {
        const live = new Set(q.docs.map(d => d.id)); let gone = 0;
        for (const id of Object.keys(cust.docs)) if (!live.has(id)) { delete cust.docs[id]; gone++; }
        if (gone) { saveCust(); showCust(); }
      }).catch(() => {});
      const mergeOrders = () => { const m = new Map(); [...recentOrders, ...pendingOrders].forEach(o => m.set(o.id, o)); snap.orders = [...m.values()]; fire(); };
      fs.collection('orders').orderBy('deliveredAt', 'desc').limit(50).onSnapshot(s => { recentOrders = docs(s); mergeOrders(); }, err);
      fs.collection('orders').where('status', '==', 'pending').onSnapshot(s => { pendingOrders = docs(s); mergeOrders(); }, err);
      // online orders and new-customer requests sent from the OZEN Order page
      fs.collection('requests').where('status', '==', 'new').onSnapshot(s => { snap.requests = docs(s); fire(); }, err);
      // pre-company fund: its own small ledger, kept apart from company money
      fs.collection('fund').onSnapshot(s => { snap.fund = docs(s); fire(); }, () => {});
      for (const [c, n] of [['txs', 50], ['moves', 20], ['logs', 30]]) fs.collection(c).orderBy('at', 'desc').limit(n).onSnapshot(s => { snap[c] = docs(s); fire(); }, err);
    },
    // One atomic, server-confirmed transaction. Reads inside fn are checked again at commit (retried by Firestore on conflict).
    async txn(fn) {
      const ts = FV.serverTimestamp();
      return fs.runTransaction(async tr => {
        const T = { get: async (col, id) => { const d = await tr.get(fs.collection(col).doc(id)); return d.exists ? { ...d.data(), id } : null; } };
        const o = await fn(T);
        for (const w of compile(o)) {
          const ref = fs.collection(w.col).doc(w.id);
          const stamp = w.col === 'customers' ? { u: ts } : {};
          if (w.kind === 'set') tr.set(ref, { ...deepConv(w.data), ...stamp });
          else if (w.kind === 'merge') tr.set(ref, nest(w.data), { merge: true });
          else tr.update(ref, { ...conv(w.data), ...stamp });
        }
        return o.result;
      });
    },
    async getDoc(col, id) { const d = await fs.collection(col).doc(id).get(); return d.exists ? { ...d.data(), id } : null; },
    async range(col, from, to, f = 'at') { return docs(await fs.collection(col).where(f, '>=', from).where(f, '<=', to).get()); },
    async since(col, from, f = 'at') { return docs(await fs.collection(col).where(f, '>=', from).get()); },
    async byCust(col, id) { return docs(await fs.collection(col).where('cust', '==', id).get()); },
    async byAcc(acc) { return docs(await fs.collection('txs').where('acc', 'array-contains', acc).get()); },
    async older(col, field, before, n) { return docs(await fs.collection(col).orderBy(field, 'desc').where(field, '<', before).limit(n).get()); },
    async allOf(col) { return docs(await fs.collection(col).get()); },
    async updateMany(col, list) { for (let i = 0; i < list.length; i += 400) { const b = fs.batch(); list.slice(i, i + 400).forEach(([id, d]) => b.update(fs.collection(col).doc(id), d)); await b.commit(); } },
    async hasDeliveries() { return !!(S.meta.settings || {}).setupLocked || !(await fs.collection('orders').where('status', '==', 'delivered').limit(1).get()).empty; },
    async wipe() {
      const refs = [];
      for (const c of ['customers', 'orders', 'txs', 'moves', 'logs', 'requests']) (await fs.collection(c).get()).forEach(d => refs.push(d.ref));
      (await fs.collection('meta').get()).forEach(d => { if (d.id.startsWith('stats_') || d.id === 'pay' || d.id === 'setup' || d.id === 'loans') refs.push(d.ref); });
      for (let i = 0; i < refs.length; i += 400) { const b = fs.batch(); refs.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit(); }
      await fs.doc('meta/stock').set({ wh: {}, factory: 0, total: 0 }); await fs.doc('meta/cash').set({ p: {}, bank: 0 });
      const rid = Date.now(); cust.resetAt = rid; cust.docs = {}; cust.u = 0; store.set(CKEY, cust);
      await fs.doc('meta/settings').set({ resetAt: rid }, { merge: true });
      location.reload();
    }
  };
}

/* ---------------- money accounts and helpers ---------------- */
// Accounts: 'bank' (company bank / QR) and partner ids p1..p5 (company cash physically held by that partner).
const accPath = a => a === 'bank' ? 'bank' : 'p.' + a;
const accName = a => a === 'bank' ? t('Company bank') : partnerName(a);
const SUPPLIERS = ['factory', 'jars', 'other'];
const supName = k => t({ factory: 'Factory (filling)', jars: 'Jar supplier', other: 'Other supplier' }[k] || k);
const depFor = pkg => Math.ceil(num(pkg) / 3) * num(settings().depositPer3);
const PKGS = [3, 6, 9, 12, 15];
// short, still unguessable link code (10 letters/digits = more than 800 million billion choices)
const randToken = () => { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'; const b = new Uint8Array(10); (window.crypto || crypto).getRandomValues(b); return Array.from(b, x => A[x % A.length]).join(''); };
const reqWhen = k => t({ asap: 'As soon as possible', morning: 'Morning', afternoon: 'Afternoon', evening: 'Evening', tomorrow: 'Tomorrow' }[k] || k || '');
const orderBase = () => location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '') + 'order/';   // …/ozen/order/
const F = (fx, col, id, path, n) => { n = Math.round(num(n) * 100) / 100; if (n) fx.push([col, id, path, n]); };
const accFx = (fx, acc, n) => F(fx, 'meta', 'cash', accPath(acc), n);
const statFx = (fx, at, field, n) => { const k = isoDay(at).replace(/-/g, ''); F(fx, 'meta', 'stats_' + k.slice(0, 4), `d.${k}.${field}`, n); };
const money2 = v => { const n = Number(v === '' || v == null ? 0 : v); if (!isFinite(n) || n < 0) throw rej(t('Amounts cannot be negative.')); return Math.round(n * 100) / 100; };
const jarsN = (v, min = 0) => { const n = Number(v === '' || v == null ? 0 : v); if (!Number.isInteger(n) || n < min) throw rej(min ? t('Enter a whole number of jars (1 or more).') : t('Jar quantities must be whole numbers, 0 or more.')); return n; };
const validAcc = a => { if (a !== 'bank' && !settings().partners.some(p => p.id === a)) throw rej(t('Choose where the money is.')); return a; };
const bal = (cash, a) => num(get0(cash || {}, accPath(a)));
let HIST = false; // true only while importing past records in date order
const needBal = (cash, a, n) => { if (HIST) return; if (n > bal(cash, a) + 0.001) throw rej(tf('{a} has only {m}. Record where the money came from first (opening balance or a transfer).', { a: accName(a), m: money(bal(cash, a)) })); };
const pastDate = v => { const at = fromInputDay(v); if (at > Date.now() + 60000) throw rej(t('Date cannot be in the future.')); return at; };
async function begin(T, a) { if (await T.get('logs', a.opId)) throw dupErr(); return Ops(); }
function finish(o, a, k, v) { o.set('logs', a.opId, { at: Date.now(), by: me().id, k, v }); return o; }
async function needCust(T, id) { const c = await T.get('customers', id); if (!c || c.deleted) throw rej(t('Customer not found.')); return c; }
// money record: from/to accounts (or payable:<supplier>), statement legs are derived from these
function txRec(type, amount, from, to, extra) {
  const acc = [from, to].filter(x => x && !/^(pay|loan):/.test(String(x)));
  return { type, amount, from: from || null, to: to || null, acc, by: me().id, ...extra };
}

/* ---------------- actions (each runs as one transaction) ---------------- */
const ACT = {
  async customerSave(T, a) {
    const o = await begin(T, a);
    const name = String(a.name || '').trim(); if (!name) throw rej(t('Name') + ': ' + t('Required'));
    const pkg = Number(a.pkg); if (!PKGS.includes(pkg)) throw rej(t('Package must be 3, 6, 9, 12 or 15 jars.'));
    const rate = money2(a.rate); if (!rate) throw rej(t('Enter the refill rate.'));
    const base = { name, phone: String(a.phone || '').trim(), area: String(a.area || '').trim(), address: String(a.address || '').trim(), mapLink: String(a.mapLink || '').trim(),
      lat: a.lat ? num(a.lat) : null, lng: a.lng ? num(a.lng) : null, pkg, expDep: depFor(pkg), rate, partner: a.partner || me().id, note: String(a.note || '').trim(), billing: a.billing === 'monthly' ? 'monthly' : 'each' };
    if (a.id) { await needCust(T, a.id); o.upd('customers', a.id, base); return finish(o, a, 'log_cust_edit', { name }); }
    const id = 'c_' + a.opId;
    o.set('customers', id, { ...base, active: true, at: HIST && a.date ? pastDate(a.date) : Date.now(), by: me().id, held: 0, due: 0, deposit: 0, delivered: 0, hist: 0 });
    o.result = id;
    return finish(o, a, 'log_cust_add', { name });
  },

  async order(T, a) {
    const o = await begin(T, a); const c = await needCust(T, a.cust);
    const qty = jarsN(a.qty, 1);
    o.set('orders', a.opId, { cust: c.id, qty, wh: a.wh, assigned: a.assigned || c.partner, note: a.note || '', status: 'pending', at: Date.now(), by: me().id });
    return finish(o, a, 'log_order', { n: qty, name: c.name });
  },
  async cancelOrder(T, a) {
    const o = await begin(T, a); const ord = await T.get('orders', a.order);
    if (!ord || ord.status !== 'pending') throw rej(t('This order is already delivered or cancelled.'));
    o.upd('orders', ord.id, { status: 'cancelled', cancelledBy: me().id, cancelledAt: Date.now() });
    if (ord.req) o.upd('requests', ord.req, { status: 'rejected', reason: String(a.reason || 'Order cancelled').slice(0, 120), rejectedBy: me().id, rejectedAt: Date.now() });
    const c = await T.get('customers', ord.cust);
    return finish(o, a, 'log_order_cancel', { name: c ? c.name : '' });
  },

  // delivery: jars, refill bill, refill payments (cash to the receiver / bank), deposit payments — all independent
  async deliver(T, a) {
    const o = await begin(T, a); const c = await needCust(T, a.cust);
    const st = (await T.get('meta', 'stock')) || {};
    let ord = null;
    if (a.order) { ord = await T.get('orders', a.order); if (!ord || ord.status !== 'pending') throw rej(t('This order is already delivered or cancelled.')); }
    const qty = jarsN(a.qty, 1), ret = jarsN(a.returned); const wh = a.wh;
    if (!settings().warehouses.some(w => w.id === wh)) throw rej(t('Choose a warehouse.'));
    if (ret > num(c.held)) throw rej(tf('{name} holds only {n} jars, so {r} empties cannot be returned.', { name: c.name, n: num(c.held), r: ret }));
    const filled = num(get0(st, `wh.${wh}.filled`)); if (qty > filled) throw rej(tf('Only {n} filled jars in {w}.', { n: filled, w: whName(wh) }));
    const rate = num(c.rate) || settings().rate; const bill = Math.round(qty * rate * 100) / 100;
    const rc = money2(a.refillCash), rb = money2(a.refillBank), dc = money2(a.depCash), db = money2(a.depBank), dOld = money2(a.depOld);
    const rcBy = rc ? validAcc(a.refillCashBy || me().id) : null, dcBy = dc ? validAcc(a.depCashBy || me().id) : null;
    if (rcBy === 'bank' || dcBy === 'bank') throw rej(t('Cash must be received by a partner.'));
    const at = pastDate(a.date); const pid = me().id; const oid = ord ? ord.id : a.opId;
    const fx = [];
    F(fx, 'meta', 'stock', `wh.${wh}.filled`, -qty); F(fx, 'meta', 'stock', `wh.${wh}.empty`, ret);
    F(fx, 'customers', c.id, 'held', qty - ret); F(fx, 'customers', c.id, 'delivered', qty);
    F(fx, 'customers', c.id, 'due', bill - rc - rb); F(fx, 'customers', c.id, 'deposit', dc + db + dOld);
    if (rc) accFx(fx, rcBy, rc); if (rb) accFx(fx, 'bank', rb); if (dc) accFx(fx, dcBy, dc); if (db) accFx(fx, 'bank', db);
    statFx(fx, at, 'bill', bill); statFx(fx, at, 'jars', qty); statFx(fx, at, 'rc', rc); statFx(fx, at, 'rb', rb); statFx(fx, at, 'dep', dc + db);
    const txIds = [];
    const addTx = (suffix, rec) => { const id = a.opId + suffix; txIds.push(id); o.set('txs', id, { ...rec, cust: c.id, ord: oid, at, fx: [] }); };
    if (rc) addTx('-rc', txRec('refill', rc, null, rcBy, { receivedBy: rcBy }));
    if (rb) addTx('-rb', txRec('refill', rb, null, 'bank', {}));
    if (dc) addTx('-dc', txRec('deposit', dc, null, dcBy, { receivedBy: dcBy }));
    if (db) addTx('-db', txRec('deposit', db, null, 'bank', {}));
    if (dOld) addTx('-do', txRec('deposit', dOld, null, null, { oldJars: true }));
    const billNoV = String(a.billNo || '').trim().slice(0, 20), seriesV = a.billSeries === 'chl' ? 'chl' : 'inv', vch = String(a.depVoucher || '').trim().slice(0, 30);
    if (vch) o.upd('customers', c.id, { depVoucher: [c.depVoucher, vch].filter(Boolean).join(', ').slice(0, 120) });
    const data = { billNo: billNoV, billSeries: seriesV, depVoucher: vch, cust: c.id, qty, returned: ret, wh, rate, bill, paidCash: rc, paidBank: rb, paid: rc + rb, depCash: dc, depBank: db, depOld: dOld,
      status: 'delivered', deliveredAt: at, deliveredBy: pid, owner: c.partner, fx, txIds };
    if (ord && ord.req) o.upd('requests', ord.req, { status: 'delivered', deliveredAt: at });
    if (ord) o.upd('orders', oid, data); else o.set('orders', oid, { ...data, direct: true, assigned: pid, by: pid, at, note: a.note || '' });
    o.upd('meta', 'settings', { setupLocked: true });
    o.fx(fx);
    return finish(o, a, 'log_deliver', { n: qty, name: c.name, amt: rc + rb + dc + db });
  },

  async payment(T, a) {
    const o = await begin(T, a); const c = await needCust(T, a.cust);
    const rc = money2(a.cash), rb = money2(a.bank); if (!(rc + rb)) throw rej(t('Enter an amount.'));
    const by = rc ? validAcc(a.cashBy || me().id) : null; if (by === 'bank') throw rej(t('Cash must be received by a partner.'));
    const at = pastDate(a.date);
    for (const [part, amount, to] of [['-c', rc, by], ['-b', rb, 'bank']]) {
      if (!amount) continue; const fx = [];
      F(fx, 'customers', c.id, 'due', -amount); accFx(fx, to, amount); statFx(fx, at, to === 'bank' ? 'rb' : 'rc', amount);
      o.set('txs', a.opId + part, { ...txRec('refill', amount, null, to, { receivedBy: to === 'bank' ? null : to }), cust: c.id, at, note: a.note || '', fx }); o.fx(fx);
    }
    return finish(o, a, 'log_payment', { amt: rc + rb, name: c.name });
  },
  async deposit(T, a) {
    const o = await begin(T, a); const c = await needCust(T, a.cust);
    const dc = money2(a.cash), db = money2(a.bank); if (!(dc + db)) throw rej(t('Enter an amount.'));
    const by = dc ? validAcc(a.cashBy || me().id) : null; if (by === 'bank') throw rej(t('Cash must be received by a partner.'));
    const at = pastDate(a.date);
    for (const [part, amount, to] of [['-c', dc, by], ['-b', db, 'bank']]) {
      if (!amount) continue; const fx = [];
      F(fx, 'customers', c.id, 'deposit', amount); accFx(fx, to, amount); statFx(fx, at, 'dep', amount);
      o.set('txs', a.opId + part, { ...txRec('deposit', amount, null, to, { receivedBy: to === 'bank' ? null : to }), cust: c.id, at, fx }); o.fx(fx);
    }
    return finish(o, a, 'log_deposit', { amt: dc + db, name: c.name });
  },
  async refund(T, a) {
    const o = await begin(T, a); const c = await needCust(T, a.cust); const cash = await T.get('meta', 'cash');
    const n = money2(a.amount); if (!n) throw rej(t('Enter an amount.'));
    if (n > num(c.deposit)) throw rej(tf('Refundable deposit is only {m}.', { m: money(c.deposit) }));
    const from = validAcc(a.from); needBal(cash, from, n);
    const at = pastDate(a.date); const fx = [];
    F(fx, 'customers', c.id, 'deposit', -n); accFx(fx, from, -n); statFx(fx, at, 'ref', n);
    o.set('txs', a.opId, { ...txRec('refund', n, from, null, {}), cust: c.id, at, note: a.note || '', fx }); o.fx(fx);
    return finish(o, a, 'log_refund', { amt: n, name: c.name });
  },
  async jarReturn(T, a) {
    const o = await begin(T, a); const c = await needCust(T, a.cust);
    const n = jarsN(a.qty, 1); if (n > num(c.held)) throw rej(tf('{name} holds only {n} jars.', { name: c.name, n: num(c.held) }));
    if (!settings().warehouses.some(w => w.id === a.wh)) throw rej(t('Choose a warehouse.'));
    const fx = []; F(fx, 'customers', c.id, 'held', -n); F(fx, 'meta', 'stock', `wh.${a.wh}.empty`, n);
    o.set('moves', a.opId, { type: 'custReturn', qty: n, wh: a.wh, cust: c.id, by: me().id, at: pastDate(a.date), fx }); o.fx(fx);
    return finish(o, a, 'log_return', { n, name: c.name });
  },
  // closing: nothing is deducted, charged or written off unless the user ticks it
  async close(T, a) {
    const o = await begin(T, a); const c = await needCust(T, a.cust); const cash = await T.get('meta', 'cash');
    if (c.active === false) throw rej(t('This account is already closed.'));
    const held = num(c.held); const ret = jarsN(a.returned);
    if (ret > held) throw rej(tf('{name} holds only {n} jars.', { name: c.name, n: held }));
    const lost = held - ret;
    if (lost && !a.lostConfirm) throw rej(tf('{n} jars are not returned. Tick "mark as lost" or collect them first.', { n: lost }));
    if (ret && !settings().warehouses.some(w => w.id === a.wh)) throw rej(t('Choose a warehouse.'));
    const charge = lost ? money2(a.lostCharge) * lost : 0;
    const due = num(c.due) + charge, dep = num(c.deposit);
    const deduct = a.deductDue ? Math.max(0, Math.min(due, dep)) : 0;
    const refund = a.refund === '' || a.refund == null ? dep - deduct : money2(a.refund);
    if (refund > dep - deduct + 0.001) throw rej(t('Refund is more than the deposit left.'));
    const from = refund ? validAcc(a.from) : null; if (refund) needBal(cash, from, refund);
    const left = Math.round((due - deduct) * 100) / 100;
    const writeOff = a.writeOff ? Math.max(0, left) : 0;
    const at = Date.now(); const fx = []; const txIds = [];
    F(fx, 'customers', c.id, 'held', -held); if (ret) F(fx, 'meta', 'stock', `wh.${a.wh}.empty`, ret); F(fx, 'meta', 'stock', 'total', -lost);
    F(fx, 'customers', c.id, 'due', charge - deduct - writeOff); F(fx, 'customers', c.id, 'deposit', -deduct - refund);
    if (refund) { accFx(fx, from, -refund); statFx(fx, at, 'ref', refund); }
    const add = (sfx, rec) => { const id = a.opId + sfx; txIds.push(id); o.set('txs', id, { ...rec, cust: c.id, at, fx: [], close: a.opId }); };
    if (charge) add('-ch', txRec('charge', charge, null, null, { note: tf('{n} lost jars', { n: lost }) }));
    if (deduct) add('-dd', txRec('depApplied', deduct, null, null, {}));
    if (refund) add('-rf', txRec('refund', refund, from, null, {}));
    if (writeOff) add('-wo', txRec('writeOff', writeOff, null, null, {}));
    o.set('moves', a.opId, { type: 'close', cust: c.id, returned: ret, lost, wh: ret ? a.wh : null, charge, deduct, refund, writeOff, dueLeft: left - writeOff, by: me().id, at, fx, txIds });
    o.upd('customers', c.id, { active: false, closedAt: at }); o.fx(fx);
    return finish(o, a, 'log_cust_close', { name: c.name, n: ret, amt: refund });
  },

  // stock movements; purchases/filling on credit keep their real cost as a supplier payable
  async stock(T, a) {
    const o = await begin(T, a); const st = (await T.get('meta', 'stock')) || {}; const cash = await T.get('meta', 'cash');
    const s = settings(); const at = pastDate(a.date); const fx = []; let txId = null;
    const whOk = w => { if (!s.warehouses.some(x => x.id === w)) throw rej(t('Choose a warehouse.')); return w; };
    const have = p => num(get0(st, p));
    const pay = (cat, cost, sup) => {
      if (!cost) return; txId = a.opId + '-x'; const tfx = [];
      if (a.pay === 'credit') { F(tfx, 'meta', 'pay', sup, cost); o.set('txs', txId, { ...txRec('expense', cost, 'pay:' + sup, null, { cat, credit: true, supplier: sup }), at, fx: tfx, move: a.opId }); }
      else { const from = validAcc(a.pay); needBal(cash, from, cost); accFx(tfx, from, -cost); o.set('txs', txId, { ...txRec('expense', cost, from, null, { cat, supplier: sup }), at, fx: tfx, move: a.opId }); }
      statFx(tfx, at, 'exp', cost); o.fx(tfx);
    };
    let label;
    if (a.type === 'toFactory') {
      const n = jarsN(a.qty, 1); whOk(a.wh); if (n > have(`wh.${a.wh}.empty`)) throw rej(tf('Only {n} empty jars in {w}.', { n: have(`wh.${a.wh}.empty`), w: whName(a.wh) }));
      F(fx, 'meta', 'stock', `wh.${a.wh}.empty`, -n); F(fx, 'meta', 'stock', 'factory', n); label = ['log_tofactory', { n, w: whName(a.wh) }];
    } else if (a.type === 'fromFactory') {
      const n = jarsN(a.qty, 1); whOk(a.wh); if (n > have('factory')) throw rej(tf('Only {n} jars are at the factory.', { n: have('factory') }));
      F(fx, 'meta', 'stock', 'factory', -n); F(fx, 'meta', 'stock', `wh.${a.wh}.filled`, n);
      pay('Filling', Math.round(n * money2(a.price) * 100) / 100, 'factory'); label = ['log_fromfactory', { n, w: whName(a.wh) }];
    } else if (a.type === 'buy') {
      const n = jarsN(a.qty, 1); whOk(a.wh);
      F(fx, 'meta', 'stock', `wh.${a.wh}.empty`, n); F(fx, 'meta', 'stock', 'total', n);
      const cost = Math.round(n * money2(a.price) * 100) / 100; pay('Jar purchase', cost, 'jars'); label = ['log_buy', { n, amt: cost }];
    } else if (a.type === 'transfer') {
      const n = jarsN(a.qty, 1); whOk(a.from); whOk(a.to); if (a.from === a.to) throw rej(t('Same warehouse'));
      const k = a.kind === 'empty' ? 'empty' : 'filled'; if (n > have(`wh.${a.from}.${k}`)) throw rej(tf('Only {n} jars there.', { n: have(`wh.${a.from}.${k}`) }));
      F(fx, 'meta', 'stock', `wh.${a.from}.${k}`, -n); F(fx, 'meta', 'stock', `wh.${a.to}.${k}`, n); label = ['log_transfer', { n, kind: k === 'filled' ? 'Filled' : 'Empty', w: whName(a.from), w2: whName(a.to) }];
    } else if (a.type === 'adjust') {
      const d = Number(a.qty); if (!Number.isInteger(d) || !d) throw rej(t('Enter a whole number, + or −.'));
      if (!String(a.note || '').trim()) throw rej(t('Write the reason (damage, count correction…).'));
      const p = a.kind === 'factory' ? 'factory' : `wh.${whOk(a.wh)}.${a.kind === 'empty' ? 'empty' : 'filled'}`;
      if (have(p) + d < 0) throw rej(tf('Only {n} jars there.', { n: have(p) }));
      F(fx, 'meta', 'stock', p, d); F(fx, 'meta', 'stock', 'total', d);
      label = ['log_adjust', { n: (d > 0 ? '+' : '') + d, kind: a.kind === 'factory' ? 'At factory' : a.kind === 'empty' ? 'Empty' : 'Filled', w: a.kind === 'factory' ? 'Factory' : whName(a.wh), note: a.note }];
    } else throw rej('?');
    o.set('moves', a.opId, { type: a.type, qty: num(a.qty), wh: a.wh || null, from: a.from || null, to: a.to || null, kind: a.kind || null, note: a.note || '', by: me().id, at, fx, txId });
    o.fx(fx);
    return finish(o, a, label[0], label[1]);
  },

  async expense(T, a) {
    const o = await begin(T, a); const cash = await T.get('meta', 'cash');
    const n = money2(a.amount); if (!n) throw rej(t('Enter an amount.'));
    const at = pastDate(a.date); const fx = []; let rec;
    if (a.from === 'credit') { const sup = SUPPLIERS.includes(a.supplier) ? a.supplier : 'other'; F(fx, 'meta', 'pay', sup, n); rec = txRec('expense', n, 'pay:' + sup, null, { cat: a.cat, credit: true, supplier: sup }); }
    else { const from = validAcc(a.from); needBal(cash, from, n); accFx(fx, from, -n); rec = txRec('expense', n, from, null, { cat: a.cat }); }
    statFx(fx, at, 'exp', n);
    o.set('txs', a.opId, { ...rec, at, note: a.note || '', fx }); o.fx(fx);
    return finish(o, a, 'log_expense', { amt: n, cat: a.cat + (a.note ? ' — ' + a.note : '') });
  },
  async supplierPay(T, a) {
    const o = await begin(T, a); const cash = await T.get('meta', 'cash'); const pay = (await T.get('meta', 'pay')) || {};
    const n = money2(a.amount); if (!n) throw rej(t('Enter an amount.'));
    const sup = a.supplier; if (n > num(pay[sup]) + 0.001) throw rej(tf('Only {m} is owed to {s}.', { m: money(pay[sup]), s: supName(sup) }));
    const from = validAcc(a.from); needBal(cash, from, n);
    const fx = []; F(fx, 'meta', 'pay', sup, -n); accFx(fx, from, -n);
    o.set('txs', a.opId, { ...txRec('supplierPay', n, from, 'pay:' + sup, { supplier: sup }), at: pastDate(a.date), note: a.note || '', fx }); o.fx(fx);
    return finish(o, a, 'log_suppay', { amt: n, s: supName(sup) });
  },
  // internal movement only: same amount out of one account and into another
  async transfer(T, a) {
    const o = await begin(T, a); const cash = await T.get('meta', 'cash');
    const n = money2(a.amount); if (!n) throw rej(t('Enter an amount.'));
    const from = validAcc(a.from), to = validAcc(a.to); if (from === to) throw rej(t('From and To are the same'));
    needBal(cash, from, n);
    const fx = []; accFx(fx, from, -n); accFx(fx, to, n);
    o.set('txs', a.opId, { ...txRec('transfer', n, from, to, {}), at: pastDate(a.date), note: a.note || '', fx }); o.fx(fx);
    return finish(o, a, 'log_transfer_money', { amt: n, a: accName(from), b: accName(to) });
  },

  // opening balances at the cut-off: posts only the difference between the wanted balance and what the
  // records already give for that moment, so repeating or correcting never adds twice
  async opening(T, a) {
    const o = await begin(T, a);
    const cash = (await T.get('meta', 'cash')) || {}; const st = (await T.get('meta', 'stock')) || {};

/* ---------------- posting, offline queue and sync state ---------------- */
const QKEY = () => 'oz_queue_' + (FIREBASE_CONFIG.projectId || 'demo');
const Q = { list: store.get(QKEY(), []), save() { store.set(QKEY(), this.list); renderSync(); } };
// Weak or no internet: any of these means "could not reach the server" → keep the entry on the phone and retry.
const isNetErr = e => !e.rej && !e.dup && (!navigator.onLine || ['unavailable', 'deadline-exceeded', 'aborted', 'resource-exhausted', 'internal', 'cancelled'].includes(e.code)
  || /offline|network|timed? ?out|fetch|connection/i.test(String(e.message || '')));
// A save that takes too long on a weak connection is kept on the phone instead of hanging. Safe: every entry has a
// fixed id, so if the slow save did reach the server, the retry is recognised as "already saved" and not posted twice.
let TX_TIMEOUT = 20000;
const txnTimed = fn => Promise.race([S.store.txn(fn), new Promise((_, rj) => setTimeout(() => rj(Object.assign(new Error('timed out'), { code: 'deadline-exceeded' })), TX_TIMEOUT))]);
async function post(name, args, opts = {}) {
  const a = { ...args, opId: args.opId || ('op' + uid()) };
  if (!DEMO && !navigator.onLine) { Q.list.push({ name, a, at: Date.now(), by: me().id, status: 'pending' }); Q.save(); if (!opts.quiet) toast(t('Saved on this device — pending sync. It is not posted until it syncs.')); return 'queued'; }
  try {
    S.sync = 'saving'; renderSync();
    const r = await txnTimed(T => ACT[name](T, a));
    S.sync = 'synced'; renderSync(); if (!opts.quiet) toast(t('Saved')); return r === undefined ? true : r;
  } catch (e) {
    S.sync = 'synced'; renderSync();
    if (e.dup) { if (!opts.quiet) toast(t('Already saved')); return true; }
    if (e.rej) { if (opts.throwRej) throw e; toast(e.message); return false; }
    if (!DEMO && isNetErr(e)) { Q.list.push({ name, a, at: Date.now(), by: me().id, status: 'pending' }); Q.save(); toast(t('Saved on this device — pending sync. It is not posted until it syncs.')); return 'queued'; }
    console.error(e); S.sync = 'failed'; renderSync(); toast(t('Failed') + ': ' + e.message); return false;
  }
}
let flushing = false;
async function flushQueue() {
  if (flushing || DEMO || !S.store || !navigator.onLine) return; flushing = true;
  try {
    for (const q of Q.list.filter(x => x.status === 'pending')) {
      try { await txnTimed(T => ACT[q.name](T, q.a)); q.status = 'done'; Q.save(); }
      catch (e) { if (e.dup) q.status = 'done'; else if (e.rej) { q.status = 'failed'; q.err = e.message; } else break; }
    }
    Q.list = Q.list.filter(x => x.status !== 'done'); Q.save();
  } finally { flushing = false; }
}
function syncState() {
  const p = Q.list.filter(x => x.status === 'pending').length, f = Q.list.filter(x => x.status === 'failed').length;
  if (f) return ['bad', tf('Failed ({n})', { n: f })];
  if (p) return ['warn', tf('Pending sync ({n})', { n: p })];
  if (S.sync === 'saving') return ['warn', t('Saving…')];
  if (!S.online) return ['warn', t('Offline')];
  return ['ok', t('Synced')];
}
function renderSync() { const el = document.querySelector('#syncpill'); if (!el) return; const [k, l] = syncState(); el.className = 'pill ' + k; el.textContent = l; }

/* ---------------- derived numbers ---------------- */
function stockTotals() {
  const wh = stockDoc().wh || {}; let filled = 0, empty = 0;
  for (const w of settings().warehouses) { filled += num(wh[w.id]?.filled); empty += num(wh[w.id]?.empty); }
  const factory = num(stockDoc().factory); const held = S.customers.reduce((a, c) => a + num(c.held), 0);
  const total = num(stockDoc().total);
  return { filled, empty, factory, held, total, sum: filled + empty + factory + held };
}
function cashTotals() {
  const c = cashDoc(); const per = {}; let sum = 0;
  for (const p of settings().partners) { per[p.id] = num(c.p?.[p.id]); sum += per[p.id]; }
  return { per, bank: num(c.bank), sum, all: sum + num(c.bank) };
}
function custTotals() {
  let due = 0, dep = 0, depOut = 0, adv = 0;
  for (const c of S.customers) { const d = num(c.due); if (d > 0) due += d; else adv -= d; dep += num(c.deposit); if (c.active !== false) depOut += Math.max(0, num(c.expDep || depFor(c.pkg)) - num(c.deposit)); }
  return { due, dep, depOut, adv };
}
const payDoc = () => S.meta.pay || {};
// daily totals (Asia/Kathmandu business days); older records stored cash/online for refill collections
function statSum(from, to) {
  const r = { bill: 0, jars: 0, rc: 0, rb: 0, dep: 0, ref: 0, exp: 0 };
  for (const [id, doc] of Object.entries(S.meta || {})) {
    if (!id.startsWith('stats_') || !doc || !doc.d) continue;
    for (const [k, v] of Object.entries(doc.d)) {
      const ms = Date.UTC(+k.slice(0, 4), +k.slice(4, 6) - 1, +k.slice(6, 8)) - KTM_OFF; // Kathmandu midnight of that business day
      if (ms < dayStart(from) || ms > to || !v) continue;
      r.bill += num(v.bill); r.jars += num(v.jars); r.rc += num(v.rc) + num(v.cash); r.rb += num(v.rb) + num(v.online);
      r.dep += num(v.dep); r.ref += num(v.ref); r.exp += num(v.exp);
    }
  }
  return r;
}
// statement legs for a money record, also for records saved by earlier versions
function txLegs(x) {
  if (!x || x.void) return [];
  const A = num(x.amount);
  if ('from' in x || 'to' in x) { const L = []; const real = v => v && !/^(pay|loan):/.test(String(v)); if (real(x.from)) L.push([x.from, -A]); if (real(x.to)) L.push([x.to, A]); return L; }
  const accOf = x.mode === 'online' ? 'bank' : x.partner;
  switch (x.type) {
    case 'sale': case 'payment': case 'deposit': case 'capital': case 'opening': return accOf ? [[accOf, A]] : [];
    case 'expense': case 'drawing': case 'refund': return x.mode === 'credit' || !accOf ? [] : [[accOf, -A]];
    case 'handover': return [[x.partner, -A], [x.to === 'bank' ? 'bank' : x.to, A]];
  }
  return [];
}
// one-time upgrade of records saved by the earlier version (adds account tags; nothing is deleted)
async function migrate() {
  const s = S.meta.settings || {}; if (DEMO || (s.schema || 1) >= 2 || S.migrating) return; S.migrating = true;
  try {
    const txs = await S.store.allOf('txs');
    const up = txs.filter(x => !x.acc).map(x => [x.id, { acc: [...new Set(txLegs({ ...x, void: false }).map(l => l[0]))] }]);
    if (up.length) await S.store.updateMany('txs', up);
    const cs = await S.store.allOf('customers');

// full check: rebuilds every balance from all records and compares it with the stored totals
async function reconcile() {
  const [orders, txs, moves, custs] = await Promise.all(['orders', 'txs', 'moves', 'customers'].map(c => S.store.allOf(c)));
  const sum = {};
  const add = list => { for (const r of list) { if (r.void || r.status === 'void') continue; for (const [c, i, p, n] of (r.fx || []).map(fxIn)) { if (i.startsWith('stats_')) continue; const k = c + '/' + i + '/' + p; sum[k] = (sum[k] || 0) + num(n); } } };
  add(orders); add(txs); add(moves);
  const rows = []; const cmp = (label, key, actual) => { const exp = Math.round((sum[key] || 0) * 100) / 100; const act = Math.round(num(actual) * 100) / 100; rows.push({ label, key, exp, act, diff: Math.round((act - exp) * 100) / 100, ok: Math.abs(exp - act) < 0.01 }); };
  cmp(t('Company bank'), 'meta/cash/bank', cashDoc().bank);
  for (const p of settings().partners) cmp(p.name + ' — ' + t('cash in hand'), 'meta/cash/p.' + p.id, cashDoc().p?.[p.id]);
  for (const w of settings().warehouses) { cmp(w.name + ' — ' + t('Filled'), `meta/stock/wh.${w.id}.filled`, stockDoc().wh?.[w.id]?.filled); cmp(w.name + ' — ' + t('Empty'), `meta/stock/wh.${w.id}.empty`, stockDoc().wh?.[w.id]?.empty); }
  cmp(t('At factory'), 'meta/stock/factory', stockDoc().factory); cmp(t('Total jars'), 'meta/stock/total', stockDoc().total);
  for (const k of SUPPLIERS) if (sum['meta/pay/' + k] || payDoc()[k]) cmp(t('Owed to') + ' ' + supName(k), 'meta/pay/' + k, payDoc()[k]);
  for (const [k, L] of Object.entries(S.meta.loans || {})) if (L && typeof L === 'object') cmp(t('Loan given') + ': ' + (L.name || k), `meta/loans/${k}.amt`, L.amt);
  for (const c of custs.filter(c => !c.deleted)) for (const k of ['held', 'deposit', 'due', 'delivered']) { const key = `customers/${c.id}/${k}`; if (Math.abs((sum[key] || 0) - num(c[k])) >= 0.01) cmp(c.name + ' — ' + k, key, c[k]); }
  return rows;
}

function bsToIso(y, m, d) {

function mapsDir(c) {
  if (c.lat && c.lng) return `https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}&travelmode=driving&dir_action=navigate`;
  if (c.mapLink) { const ll = parseLatLng(c.mapLink); if (ll) return `https://www.google.com/maps/dir/?api=1&destination=${ll[0]},${ll[1]}&travelmode=driving&dir_action=navigate`;
    return /^https?:/i.test(c.mapLink) ? c.mapLink : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.mapLink); }

}
function parseLatLng(link) {
  link = String(link || '');
  // 27°41'16.2"N 85°17'37.5"E  (what Google Maps shows when you tap a pin)
  const d = link.match(/(\d+(?:\.\d+)?)\s*°\s*(\d+(?:\.\d+)?)?\s*['′]?\s*(\d+(?:\.\d+)?)?\s*(?:["″]|'')?\s*([NS])[\s,]+(\d+(?:\.\d+)?)\s*°\s*(\d+(?:\.\d+)?)?\s*['′]?\s*(\d+(?:\.\d+)?)?\s*(?:["″]|'')?\s*([EW])/i);
  if (d) {
    const dec = (g, m, s, h) => { const v = Number(g) + Number(m || 0) / 60 + Number(s || 0) / 3600; return (/[SW]/i.test(h) ? -v : v).toFixed(6); };
    return [dec(d[1], d[2], d[3], d[4]), dec(d[5], d[6], d[7], d[8])];
  }
  const m = link.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || link.match(/[?&](?:q|query|destination|ll|center)=(?:loc:)?(-?\d+\.\d+),\s*(-?\d+\.\d+)/)
    || link.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || link.match(/geo:(-?\d+\.\d+),(-?\d+\.\d+)/) || link.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
  return m ? [m[1], m[2]] : null;
}

async function importBillNos(file) {
  let d; try { d = JSON.parse(await file.text()); } catch (e) { toast(t('This file could not be read.')); return; }
  if (!d || d.kind !== 'ozen-bill-numbers' || !Array.isArray(d.orders)) { toast(t('This is not a bill-number file.')); return; }
  const out = $('#bnProg'); let done = 0, skip = 0, miss = 0; const all = allOf('orders');
  for (const r of d.orders) {
    const o = all.find(x => x.id === r.id); if (!o || o.status !== 'delivered') { miss++; continue; }
    if (String(o.billNo || '') === String(r.billNo) && (o.billSeries || 'inv') === r.billSeries && (r.depVoucher === undefined || String(o.depVoucher || '') === String(r.depVoucher))) { skip++; continue; }
    const a = { id: r.id, billNo: r.billNo, billSeries: r.billSeries, opId: 'bn_' + r.id + '_' + r.billSeries + r.billNo }; if (r.depVoucher !== undefined) a.depVoucher = r.depVoucher;
    const ok = await post('setBillNo', a, { quiet: true }); if (ok) done++; else miss++;
    if (out) out.textContent = tf('Done {a} · already set {b} · not found {c}', { a: done, b: skip, c: miss });
  }
  for (const v of d.vouchers || []) { const c = custById(v.cust); if (!c || String(c.depVoucher || '') === String(v.depVoucher)) continue; if (await post('setVoucher', { cust: v.cust, depVoucher: v.depVoucher, opId: 'vc_' + v.cust + '_' + String(v.depVoucher).replace(/\W/g, '') }, { quiet: true })) done++; }
  if (out) out.textContent = tf('Done {a} · already set {b} · not found {c}', { a: done, b: skip, c: miss });
  toast(t('Bill numbers imported.')); render();
}

const hashId = s => { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
const normKey = (name, phone) => String(name || '').trim().toLowerCase().replace(/\s+/g, ' ') + '|' + String(phone || '').replace(/\D/g, '');
async function afterCutoff(cutoff) {
  // effects of every non-opening record after the cut-off; opening = current − these
  const [os, ts, ms] = await Promise.all([S.store.since('orders', cutoff, 'deliveredAt'), S.store.since('txs', cutoff), S.store.since('moves', cutoff)]);
  const sum = {}; let n = 0;
  for (const r of [...os, ...ts, ...ms]) {
    if (r.void || r.status === 'void' || r.opening || r.type === 'opening' || r.type === 'openCust') continue; n++;
    for (const [c, i, p, v] of (r.fx || []).map(fxIn)) { const k = `${c}/${i}/${p}`; sum[k] = (sum[k] || 0) + num(v); }
  }
  return { sum, n };
}

async function setupPreview(f) {

function parseCustomers(wb) {

    const name = String(r['Name'] || '').trim(); if (!name || /^example/i.test(name)) continue;
    const phone = String(r['Phone'] || '').trim(); const key = normKey(name, phone);
    const pn = parseInt(r['Partner No']) || 0; const link = String(r['Map Link'] || '').trim(); const ll = link ? parseLatLng(link) : null;
    const row = { name, phone, area: String(r['Area'] || '').trim(), address: String(r['Landmark'] || '').trim(), mapLink: link, lat: ll ? ll[0] : '', lng: ll ? ll[1] : '',
      pkg: Number(r['Package']) || 3, rate: num(r['Rate']) || settings().rate, partner: pn >= 1 && pn <= 5 ? 'p' + pn : me().id, note: String(r['Note'] || '').trim(),
      held: Number(r['Jars With Customer'] || 0), deposit: Number(r['Deposit Taken'] || 0), due: Number(r['Old Due'] || 0), hist: Number(r['Refills Before App'] || 0) };
    if (seen.has(key)) row.skip = t('Duplicate row in file');
    else if (![row.held, row.hist].every(v => Number.isInteger(v) && v >= 0)) row.skip = t('Jar quantities must be whole numbers, 0 or more.');
    else if (row.deposit < 0) row.skip = t('Amounts cannot be negative.');

    seen.add(key);

    rows.push(row);
  }

}

async function historyImport(file) {
  let H; try { H = JSON.parse(await file.text()); } catch (e) { toast(t('This is not a history file.')); return; }
  if (!H || H.kind !== 'ozen-history' || !Array.isArray(H.ops)) { toast(t('This is not a history file.')); return; }
  const already = (S.meta.settings || {}).histImport === H.id;   // same file started before: continue where it stopped
  if ((S.customers.length || S.txs.length) && !already) { toast(t('The app must be empty first. Use “Empty the app” below.')); return; }
  if (!DEMO && !navigator.onLine) { toast(t('Connect to the internet first.')); return; }
  if (!confirm(tf('Import {n} records from {f}?', { n: H.ops.length, f: file.name }))) return;
  // practice mode: use the real partner and warehouse names from the file
  if (DEMO && H.settings) await post('settings', { s: H.settings }, { quiet: true });
  // '@samir', '@naikap'… in the file are matched to this app's partners and warehouses by name
  const map = {}; const missing = [];
  for (const [tok, name] of Object.entries(H.people || {})) { const p = settings().partners.find(x => String(x.name || '').toLowerCase().includes(name)); if (p) map['@' + tok] = p.id; else missing.push(name); }
  for (const [tok, name] of Object.entries(H.places || {})) { const w = settings().warehouses.find(x => String(x.name || '').toLowerCase().includes(name)); if (w) map['@' + tok] = w.id; else missing.push(name); }
  if (missing.length) { alert(t('These names are not in Settings:') + ' ' + missing.join(', ')); return; }
  const sub = v => typeof v === 'string' && v.startsWith('@') ? (map[v] || v) : v;
  if (!already) await post('settings', { s: { histImport: H.id } }, { quiet: true });
  const ids = {}; const box = $('#histProg'); HIST = true; let i = 0;
  try {
    for (const op of H.ops) {

function cCalc(init) {
  const f = document.querySelector('.veil form'); if (!f || !f.lostCharge) return; const c = custById(f.cust.value);
  const lost = Math.max(0, num(c.held) - num(f.returned.value)); const charge = f.lostConfirm.checked ? lost * num(f.lostCharge.value) : 0;
  const due = num(c.due) + charge; const deduct = f.deductDue.checked ? Math.max(0, Math.min(due, num(c.deposit))) : 0;
  if (init || document.activeElement !== f.refund) f.refund.value = Math.max(0, num(c.deposit) - deduct);
  const left = due - deduct; const wo = f.writeOff.checked ? Math.max(0, left) : 0;
  $('#closeOut').className = 'alert small ' + (left - wo > 0 ? 'warn' : 'ok');
  $('#closeOut').textContent = [lost ? (f.lostConfirm.checked ? tf('{n} jars marked lost (removed from owned jars).', { n: lost }) : tf('{n} jars not returned — tick "mark as lost" or collect them first.', { n: lost })) : '',
    tf('Refund {r}. Due left {d}.', { r: money(f.refund.value), d: money(left - wo) }), left - wo > 0 ? t('The due stays on the customer and in dashboard dues.') : ''].filter(Boolean).join(' ');
}
